<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Snake</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #061418;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #d7f3ee;
    }
    .game-container { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; width: 400px; }
    .title {
        font-size: 26px; font-weight: bold; letter-spacing: 2px;
        background: linear-gradient(90deg, #29b6f6, #ff9800);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hud { display: flex; gap: 14px; font-size: 14px; font-weight: bold; }
    .hud span.label { opacity: 0.6; font-weight: normal; }
    .hud .score { color: #aeea00; }
    .hud .best { color: #ffd54f; }
    .hud .speed { color: #4dd0e1; }
    .board { position: relative; width: 400px; height: 400px; }
    canvas {
        display: block; border: 2px solid #0e4a52; border-radius: 4px;
        box-shadow: 0 0 30px rgba(41, 182, 246, 0.15);
    }
    .overlay {
        position: absolute; top: 2px; left: 2px; width: 400px; height: 400px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; text-align: center; padding: 20px;
        background: rgba(4, 16, 20, 0.93); border-radius: 4px;
    }
    .overlay h2 { font-size: 30px; letter-spacing: 3px; color: #4dd0e1; text-shadow: 0 0 12px rgba(77, 208, 225, 0.6); }
    .overlay p { font-size: 14px; line-height: 1.6; color: #a7c7c4; }
    .overlay .big { font-size: 20px; color: #ffd54f; font-weight: bold; }
    .legend { display: flex; gap: 12px; font-size: 12px; color: #a7c7c4; flex-wrap: wrap; justify-content: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .btn {
        padding: 10px 28px; font-size: 15px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
        color: #4dd0e1; background: transparent; border: 2px solid #4dd0e1; border-radius: 6px; cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(77, 208, 225, 0.15); box-shadow: 0 0 16px rgba(77, 208, 225, 0.5); }
    .hint { font-size: 12px; color: #5f8c88; }
    .hidden { display: none; }
</style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="title">PORTAL SNAKE</div>
        <div class="hud">
            <div><span class="label">Score</span> <span class="score" id="score">0</span></div>
            <div><span class="label">Best</span> <span class="best" id="best">0</span></div>
            <div><span class="label">Spd</span> <span class="speed" id="level">1</span></div>
        </div>
    </div>
    <div class="board">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="overlay" id="startScreen">
            <h2>PORTAL SNAKE</h2>
            <p>Steer with <b>Arrow keys</b> or <b>WASD</b>. Space / P pauses.<br>
               Enter a portal to pop out of its twin.</p>
            <div class="legend">
                <span><i class="dot" style="background:#ef5350"></i>Food +10</span>
                <span><i class="dot" style="background:#ffd54f"></i>Bonus +50 (5s)</span>
                <span><i class="dot" style="background:#29b6f6"></i><i class="dot" style="background:#ff9800"></i>Portals</span>
                <span><i class="dot" style="background:#78756b;border-radius:2px"></i>Stone</span>
            </div>
            <button class="btn" id="startBtn">Start Game</button>
            <div class="hint">or press Enter</div>
        </div>

        <div class="overlay hidden" id="pauseScreen">
            <h2>PAUSED</h2>
            <div class="hint">Press Space or P to resume</div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h2>GAME OVER</h2>
            <p class="big">Score: <span id="finalScore">0</span></p>
            <p>Best: <span id="finalBest">0</span> <span id="newBest" class="hidden">- New record!</span></p>
            <button class="btn" id="restartBtn">Play Again</button>
            <div class="hint">or press Enter</div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    // ---------- Constants ----------
    var CANVAS_SIZE = 400;
    var GRID = 20;
    var CELL = CANVAS_SIZE / GRID;
    var START_INTERVAL = 140;
    var MIN_INTERVAL = 60;
    var INTERVAL_STEP = 8;
    var FOOD_POINTS = 10;
    var BONUS_POINTS = 50;
    var BONUS_DURATION = 5000;
    var BONUS_CHANCE = 0.25;
    var FOODS_PER_LEVEL = 5;
    var FOODS_PER_OBSTACLE = 5;
    var MAX_OBSTACLES = 15;
    var PORTAL_SCORE_STEP = 100;
    var STORAGE_KEY = 'portalSnakeBest';

    // ---------- State ----------
    var state = 'start'; // start | playing | paused | gameover
    var snake, dir, nextDir, food, bonus, portals, obstacles;
    var score, eaten, level, best, timer, pauseStart, portalMilestone;
    var memoryBest = 0;

    // ---------- DOM ----------
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('score');
    var bestEl = document.getElementById('best');
    var levelEl = document.getElementById('level');
    var startScreen = document.getElementById('startScreen');
    var pauseScreen = document.getElementById('pauseScreen');
    var gameOverScreen = document.getElementById('gameOverScreen');
    var finalScoreEl = document.getElementById('finalScore');
    var finalBestEl = document.getElementById('finalBest');
    var newBestEl = document.getElementById('newBest');

    // ---------- Persistence ----------
    function loadBest() {
        try {
            var v = parseInt(window.localStorage.getItem(STORAGE_KEY), 10);
            return isNaN(v) ? memoryBest : v;
        } catch (e) { return memoryBest; }
    }
    function saveBest(v) {
        memoryBest = v;
        try { window.localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) { /* ignore */ }
    }

    // ---------- Helpers ----------
    function same(a, b) { return a && b && a.x === b.x && a.y === b.y; }
    function inList(list, c) {
        for (var i = 0; i < list.length; i++) if (same(list[i], c)) return true;
        return false;
    }
    function isOccupied(c) {
        return inList(snake, c) || same(food, c) || same(bonus, c) ||
               inList(portals, c) || inList(obstacles, c);
    }
    // Pick a random free cell; `reject` is an optional extra predicate.
    function emptyCell(reject) {
        var free = [];
        for (var x = 0; x < GRID; x++) {
            for (var y = 0; y < GRID; y++) {
                var c = { x: x, y: y };
                if (isOccupied(c)) continue;
                if (reject && reject(c)) continue;
                free.push(c);
            }
        }
        return free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }
    function intervalMs() { return Math.max(MIN_INTERVAL, START_INTERVAL - INTERVAL_STEP * level); }

    // ---------- Spawning ----------
    function placePortals() {
        // Remove old portals first so they do not block their own new positions.
        portals = [];
        var a = emptyCell();
        if (!a) return;
        portals = [a];
        var b = emptyCell();
        portals = b ? [a, b] : [];
    }
    function spawnFood() {
        food = null;
        food = emptyCell();
        return food !== null;
    }
    function maybeSpawnBonus() {
        if (bonus || Math.random() >= BONUS_CHANCE) return;
        var c = emptyCell();
        if (c) bonus = { x: c.x, y: c.y, expires: performance.now() + BONUS_DURATION };
    }
    function addObstacle() {
        if (obstacles.length >= MAX_OBSTACLES) return;
        var h = snake[0];
        var c = emptyCell(function (cell) {
            if (Math.abs(cell.x - h.x) + Math.abs(cell.y - h.y) <= 3) return true;
            for (var i = 1; i <= 3; i++) {
                if (cell.x === h.x + dir.x * i && cell.y === h.y + dir.y * i) return true;
            }
            return false;
        });
        if (c) obstacles.push(c);
    }

    // ---------- Game lifecycle ----------
    function initGame() {
        var mid = Math.floor(GRID / 2);
        snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        food = null; bonus = null; portals = []; obstacles = [];
        score = 0; eaten = 0; level = 0; portalMilestone = 0;
        best = loadBest();
        placePortals();
        spawnFood();
        updateHud();
    }

    function updateHud() {
        scoreEl.textContent = score;
        bestEl.textContent = Math.max(best, score);
        levelEl.textContent = level + 1;
    }

    function show(el, visible) { el.classList.toggle('hidden', !visible); }

    function startGame() {
        initGame();
        state = 'playing';
        show(startScreen, false); show(pauseScreen, false); show(gameOverScreen, false);
        scheduleTick();
    }

    function scheduleTick() {
        clearTimeout(timer);
        timer = setTimeout(function () {
            if (state !== 'playing') return;
            tick();
            if (state === 'playing') scheduleTick();
        }, intervalMs());
    }

    function togglePause() {
        if (state === 'playing') {
            state = 'paused';
            clearTimeout(timer);
            pauseStart = performance.now();
            show(pauseScreen, true);
        } else if (state === 'paused') {
            if (bonus) bonus.expires += performance.now() - pauseStart;
            state = 'playing';
            show(pauseScreen, false);
            scheduleTick();
        }
    }

    function endGame() {
        state = 'gameover';
        clearTimeout(timer);
        var isRecord = score > best;
        if (isRecord) { best = score; saveBest(best); }
        updateHud();
        finalScoreEl.textContent = score;
        finalBestEl.textContent = best;
        show(newBestEl, isRecord);
        show(gameOverScreen, true);
    }

    // ---------- Tick (game logic) ----------
    function tick() {
        dir = { x: nextDir.x, y: nextDir.y };

        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Wall
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { endGame(); return; }

        // Portal teleport (exit cell is a portal, so it cannot hold another entity)
        if (portals.length === 2) {
            if (same(head, portals[0])) head = { x: portals[1].x, y: portals[1].y };
            else if (same(head, portals[1])) head = { x: portals[0].x, y: portals[0].y };
        }

        var eatsFood = same(head, food);
        var eatsBonus = same(head, bonus);
        var grows = eatsFood || eatsBonus;

        // Obstacle
        if (inList(obstacles, head)) { endGame(); return; }

        // Self (tail cell is vacated this tick unless the snake grows)
        var body = grows ? snake : snake.slice(0, -1);
        if (inList(body, head)) { endGame(); return; }

        snake.unshift(head);
        if (!grows) snake.pop();

        if (eatsFood) {
            score += FOOD_POINTS;
            eaten++;
            level = Math.floor(eaten / FOODS_PER_LEVEL);
            if (!spawnFood()) { updateHud(); endGame(); return; } // board full: you win
            if (eaten % FOODS_PER_OBSTACLE === 0) addObstacle();
            maybeSpawnBonus();
        } else if (eatsBonus) {
            score += BONUS_POINTS;
            bonus = null;
        }

        // Relocate portals every PORTAL_SCORE_STEP points
        var milestone = Math.floor(score / PORTAL_SCORE_STEP);
        if (milestone > portalMilestone) {
            portalMilestone = milestone;
            placePortals();
        }

        // Expire bonus
        if (bonus && performance.now() >= bonus.expires) bonus = null;

        updateHud();
    }

    // ---------- Input ----------
    var KEY_DIRS = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
        W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
    };

    document.addEventListener('keydown', function (e) {
        var k = e.key;
        var isArrowOrSpace = k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' || k === ' ';
        if (isArrowOrSpace) e.preventDefault();

        if (k === ' ' || k === 'p' || k === 'P') {
            if (state === 'playing' || state === 'paused') togglePause();
            return;
        }
        if (k === 'Enter') {
            if (state === 'start' || state === 'gameover') startGame();
            return;
        }
        var d = KEY_DIRS[k];
        if (!d) return;
        if (state === 'start' || state === 'gameover') {
            if (k.indexOf('Arrow') === 0) startGame(); else return;
        }
        if (state !== 'playing') return;
        // Compare to the *applied* direction so quick double-presses cannot reverse.
        if (d.x === -dir.x && d.y === -dir.y) return;
        nextDir = d;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // ---------- Rendering ----------
    function cx(c) { return c.x * CELL + CELL / 2; }
    function cy(c) { return c.y * CELL + CELL / 2; }

    function drawBoard() {
        ctx.fillStyle = '#071d22';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        ctx.strokeStyle = 'rgba(77, 208, 225, 0.07)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= GRID; i++) {
            ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, CANVAS_SIZE); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(CANVAS_SIZE, i * CELL); ctx.stroke();
        }
    }

    function drawPortals(t) {
        var colors = ['#29b6f6', '#ff9800'];
        for (var i = 0; i < portals.length; i++) {
            var p = portals[i], x = cx(p), y = cy(p), col = colors[i];
            ctx.save();
            ctx.shadowColor = col; ctx.shadowBlur = 12;
            ctx.strokeStyle = col; ctx.lineWidth = 2;
            for (var r = 0; r < 3; r++) {
                var rad = CELL / 2 - 2 - r * 3;
                var start = t * 0.004 * (r % 2 ? -1 : 1) + r;
                ctx.beginPath();
                ctx.arc(x, y, rad, start, start + Math.PI * 1.5);
                ctx.stroke();
            }
            ctx.restore();
            ctx.fillStyle = col;
            ctx.globalAlpha = 0.35;
            ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function drawObstacles() {
        for (var i = 0; i < obstacles.length; i++) {
            var o = obstacles[i], px = o.x * CELL, py = o.y * CELL;
            ctx.fillStyle = '#78756b';
            ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
            ctx.fillStyle = '#9a968a';
            ctx.fillRect(px + 1, py + 1, CELL - 2, 3);
            ctx.fillStyle = '#55524a';
            ctx.fillRect(px + 1, py + CELL - 4, CELL - 2, 3);
            ctx.strokeStyle = '#3d3b35'; ctx.lineWidth = 1;
            ctx.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
        }
    }

    function drawFood(t) {
        if (!food) return;
        var pulse = Math.sin(t * 0.008) * 0.12 + 0.88;
        ctx.save();
        ctx.shadowColor = '#ef5350'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#ef5350';
        ctx.beginPath(); ctx.arc(cx(food), cy(food), (CELL / 2 - 3) * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(cx(food) - 2, cy(food) - 2, 2, 0, Math.PI * 2); ctx.fill();
    }

    function drawBonus(t) {
        if (!bonus) return;
        var x = cx(bonus), y = cy(bonus);
        var now = state === 'paused' ? pauseStart : performance.now();
        var frac = Math.max(0, (bonus.expires - now) / BONUS_DURATION);
        ctx.save();
        ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        var spin = t * 0.002, R = CELL / 2 - 4, r = R * 0.45;
        for (var i = 0; i < 5; i++) {
            var a = spin + (Math.PI * 2 / 5) * i - Math.PI / 2;
            var b = a + Math.PI / 5;
            ctx.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R);
            ctx.lineTo(x + Math.cos(b) * r, y + Math.sin(b) * r);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // Countdown ring
        ctx.strokeStyle = frac < 0.3 ? '#ef5350' : '#fff59d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, CELL / 2 - 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
        ctx.stroke();
    }

    function drawSnake() {
        for (var i = snake.length - 1; i >= 0; i--) {
            var s = snake[i], t = i / snake.length;
            var size = CELL - 3 - (i === 0 ? 0 : t * 3);
            var g = Math.floor(230 - t * 90);
            ctx.fillStyle = i === 0 ? '#c6ff00' : 'rgb(' + Math.floor(100 - t * 40) + ',' + g + ',60)';
            ctx.beginPath();
            var px = cx(s) - size / 2, py = cy(s) - size / 2;
            if (ctx.roundRect) ctx.roundRect(px, py, size, size, 5); else ctx.rect(px, py, size, size);
            ctx.fill();
        }
        // Eyes
        var h = snake[0];
        var ex = -dir.y, ey = dir.x; // perpendicular
        ctx.fillStyle = '#062';
        for (var side = -1; side <= 1; side += 2) {
            ctx.beginPath();
            ctx.arc(cx(h) + dir.x * 3 + ex * side * 3.5, cy(h) + dir.y * 3 + ey * side * 3.5, 1.8, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function render(t) {
        if (snake) {
            drawBoard();
            drawObstacles();
            drawPortals(t);
            drawFood(t);
            drawBonus(t);
            drawSnake();
        } else {
            drawBoard();
        }
        requestAnimationFrame(render);
    }

    // ---------- Boot ----------
    best = loadBest();
    bestEl.textContent = best;
    requestAnimationFrame(render);

    // Expose a tiny hook for automated smoke tests.
    window.__portalSnake = {
        start: startGame,
        tick: tick,
        getState: function () {
            return { state: state, snake: snake, food: food, bonus: bonus, portals: portals,
                     obstacles: obstacles, score: score, level: level };
        },
        setDir: function (x, y) { nextDir = { x: x, y: y }; },
        setPortals: function (p) { portals = p; }
    };
})();
</script>
</body>
</html>
