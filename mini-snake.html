<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 300px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .score {
            font-size: 16px;
            color: #ffab40;
        }

        .board {
            position: relative;
        }

        canvas {
            display: block;
            border: 2px solid #1a237e;
            background-color: #050514;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(5, 5, 20, 0.88);
            cursor: pointer;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 22px;
            letter-spacing: 1px;
            color: #ff5252;
        }

        .hint {
            font-size: 12px;
            color: #5c6bc0;
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="header">
            <span class="title">MINI SNAKE</span>
            <span class="score">Score: <span id="score">0</span></span>
        </div>
        <div class="board">
            <canvas id="board" width="300" height="300"></canvas>
            <div id="overlay" class="overlay hidden">
                <h2>GAME OVER</h2>
                <p>Final score: <span id="finalScore">0</span></p>
                <p class="hint">Press Space / Enter or click to restart</p>
            </div>
        </div>
        <p class="hint">Arrow keys or WASD to steer</p>
    </div>

    <script>
        const CELL = 20;
        const COLS = 15;
        const ROWS = 15;
        const TICK_MS = 120;

        const DELTAS = {
            up:    { x:  0, y: -1 },
            down:  { x:  0, y:  1 },
            left:  { x: -1, y:  0 },
            right: { x:  1, y:  0 }
        };

        const KEY_DIRECTIONS = {
            ArrowUp: 'up',       KeyW: 'up',
            ArrowDown: 'down',   KeyS: 'down',
            ArrowLeft: 'left',   KeyA: 'left',
            ArrowRight: 'right', KeyD: 'right'
        };

        const OPPOSITES = { up: 'down', down: 'up', left: 'right', right: 'left' };

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const overlayEl = document.getElementById('overlay');

        let snake, direction, nextDirection, food, score, isGameOver;

        function resetGame() {
            snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            isGameOver = false;
            scoreEl.textContent = score;
            overlayEl.classList.add('hidden');
            placeFood();
            draw();
        }

        // Pick uniformly from the cells the snake does not occupy, so food can
        // never spawn inside the snake.
        function placeFood() {
            const freeCells = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (!snake.some(part => part.x === x && part.y === y)) {
                        freeCells.push({ x, y });
                    }
                }
            }
            food = freeCells.length ? freeCells[Math.floor(Math.random() * freeCells.length)] : null;
        }

        function step() {
            if (isGameOver) return;

            direction = nextDirection;
            const delta = DELTAS[direction];
            const head = { x: snake[0].x + delta.x, y: snake[0].y + delta.y };

            const ate = food !== null && head.x === food.x && head.y === food.y;
            // The tail cell is vacated on this tick unless the snake grows.
            const body = ate ? snake : snake.slice(0, -1);

            const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
            const hitSelf = body.some(part => part.x === head.x && part.y === head.y);
            if (hitWall || hitSelf) {
                endGame();
                return;
            }

            snake.unshift(head);
            if (ate) {
                score++;
                scoreEl.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.textContent = score;
            overlayEl.classList.remove('hidden');
        }

        function draw() {
            ctx.fillStyle = '#050514';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (food !== null) {
                ctx.fillStyle = '#ff5252';
                ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
            }

            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00e5ff' : '#69f0ae';
                ctx.fillRect(part.x * CELL + 1, part.y * CELL + 1, CELL - 2, CELL - 2);
            });
        }

        document.addEventListener('keydown', event => {
            // Always swallow Space/Enter so the page never scrolls.
            if (event.code === 'Space' || event.code === 'Enter') {
                event.preventDefault();
                if (isGameOver) resetGame();
                return;
            }

            const requested = KEY_DIRECTIONS[event.code];
            if (!requested) return;
            event.preventDefault();
            // Compare against the direction last applied by step() so two quick
            // key presses in one tick cannot fold the snake back on itself.
            if (requested !== OPPOSITES[direction]) nextDirection = requested;
        });

        overlayEl.addEventListener('click', () => resetGame());

        resetGame();
        // One interval for the page lifetime; restarts only reset state, so the
        // speed can never double no matter how often the game is replayed.
        setInterval(step, TICK_MS);
    </script>
</body>
</html>
