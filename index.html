<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 20px rgba(0, 229, 255, 0.3);
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .difficulty-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid;
        }

        .difficulty-label.hidden {
            display: none;
        }

        .difficulty-label.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            text-shadow: 0 0 6px rgba(105, 240, 174, 0.5);
        }

        .difficulty-label.medium {
            color: #ffab40;
            border-color: #ffab40;
            text-shadow: 0 0 6px rgba(255, 171, 64, 0.5);
        }

        .difficulty-label.hard {
            color: #ff5252;
            border-color: #ff5252;
            text-shadow: 0 0 6px rgba(255, 82, 82, 0.5);
        }

        .score-display {
            font-size: 20px;
            color: #ffab40;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 171, 64, 0.4);
        }

        canvas {
            border: 2px solid #1a237e;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(10, 10, 40, 0.95) 0%, rgba(5, 5, 20, 0.98) 100%);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.7), 0 0 30px rgba(0, 229, 255, 0.4);
            letter-spacing: 3px;
        }

        .overlay p {
            font-size: 16px;
            color: #b0bec5;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #ffab40;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 171, 64, 0.5);
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #00e5ff;
            background: transparent;
            border: 2px solid #00e5ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1);
        }

        .btn:hover {
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 15px rgba(0, 229, 255, 0.2);
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .difficulty-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .difficulty-btn .diff-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .difficulty-btn .diff-name {
            font-size: 16px;
        }

        .difficulty-btn .diff-desc {
            font-size: 11px;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.7;
        }

        .difficulty-btn .diff-key {
            font-size: 12px;
            opacity: 0.5;
            font-weight: normal;
        }

        .difficulty-btn.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            box-shadow: 0 0 10px rgba(105, 240, 174, 0.3), inset 0 0 10px rgba(105, 240, 174, 0.1);
        }

        .difficulty-btn.easy:hover {
            background: rgba(105, 240, 174, 0.15);
            box-shadow: 0 0 20px rgba(105, 240, 174, 0.6), inset 0 0 15px rgba(105, 240, 174, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(105, 240, 174, 0.8);
        }

        .difficulty-btn.medium {
            color: #ffab40;
            border-color: #ffab40;
            box-shadow: 0 0 10px rgba(255, 171, 64, 0.3), inset 0 0 10px rgba(255, 171, 64, 0.1);
        }

        .difficulty-btn.medium:hover {
            background: rgba(255, 171, 64, 0.15);
            box-shadow: 0 0 20px rgba(255, 171, 64, 0.6), inset 0 0 15px rgba(255, 171, 64, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 171, 64, 0.8);
        }

        .difficulty-btn.hard {
            color: #ff5252;
            border-color: #ff5252;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3), inset 0 0 10px rgba(255, 82, 82, 0.1);
        }

        .difficulty-btn.hard:hover {
            background: rgba(255, 82, 82, 0.15);
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.6), inset 0 0 15px rgba(255, 82, 82, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 82, 82, 0.8);
        }

        .difficulty-btn:active {
            transform: scale(0.97);
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #5c6bc0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .game-over-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .btn-secondary {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: bold;
            color: #b0bec5;
            background: transparent;
            border: 1px solid #5c6bc0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(92, 107, 192, 0.2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-secondary:hover {
            color: #e0e0e0;
            border-color: #7986cb;
            background: rgba(92, 107, 192, 0.15);
            box-shadow: 0 0 15px rgba(92, 107, 192, 0.4);
            transform: scale(1.05);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #5c6bc0;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">SPACE SNAKE</div>
            <div class="header-right">
                <span class="difficulty-label hidden" id="difficultyLabel"></span>
                <div class="score-display">Energy: <span id="score">0</span></div>
            </div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="difficultyScreen">
                <h2>COSMIC SERPENT</h2>
                <div class="overlay-subtitle">Select Mission Difficulty</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn easy" id="easyBtn" data-difficulty="easy">
                        <div class="diff-info">
                            <span class="diff-name">Easy</span>
                            <span class="diff-desc">Slow speed, 1x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 1 ]</span>
                    </button>
                    <button class="difficulty-btn medium" id="mediumBtn" data-difficulty="medium">
                        <div class="diff-info">
                            <span class="diff-name">Medium</span>
                            <span class="diff-desc">Normal speed, 2x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 2 ]</span>
                    </button>
                    <button class="difficulty-btn hard" id="hardBtn" data-difficulty="hard">
                        <div class="diff-info">
                            <span class="diff-name">Hard</span>
                            <span class="diff-desc">Fast speed, 3x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 3 ]</span>
                    </button>
                </div>
                <div class="instructions">Press 1, 2, or 3 to select</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>SHIP DESTROYED</h2>
                <p class="final-score">Energy Collected: <span id="finalScore">0</span></p>
                <div class="game-over-buttons">
                    <button class="btn" id="restartBtn">Relaunch</button>
                    <button class="btn-secondary" id="changeDifficultyBtn">Change Difficulty</button>
                </div>
                <div class="instructions">Press Enter to relaunch or Esc to change difficulty</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

            // Difficulty settings
            const DIFFICULTY_SETTINGS = {
                easy:   { speed: 150, multiplier: 1, label: 'Easy',   color: '#69f0ae', cssClass: 'easy' },
                medium: { speed: 120, multiplier: 2, label: 'Medium', color: '#ffab40', cssClass: 'medium' },
                hard:   { speed: 80,  multiplier: 3, label: 'Hard',   color: '#ff5252', cssClass: 'hard' }
            };

            // Current difficulty state
            let currentDifficulty = null; // 'easy', 'medium', or 'hard'
            let gameSpeed = 120;
            let scoreMultiplier = 1;

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let rawScore = 0; // Score before multiplier
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;
            let difficultySelected = false;

            // Space theme state
            let stars = [];
            let particles = [];
            let thrusterParticles = [];
            let foodType = 0; // 0 = planet, 1 = star, 2 = energy orb
            let foodPulse = 0;
            let starfieldOffset = 0;
            let animationFrame = null;

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const difficultyScreen = document.getElementById('difficultyScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const difficultyLabel = document.getElementById('difficultyLabel');
            const easyBtn = document.getElementById('easyBtn');
            const mediumBtn = document.getElementById('mediumBtn');
            const hardBtn = document.getElementById('hardBtn');
            const restartBtn = document.getElementById('restartBtn');
            const changeDifficultyBtn = document.getElementById('changeDifficultyBtn');

            // Generate starfield
            function generateStars() {
                stars = [];
                for (var i = 0; i < 120; i++) {
                    stars.push({
                        x: Math.random() * CANVAS_SIZE,
                        y: Math.random() * CANVAS_SIZE,
                        size: Math.random() * 2 + 0.5,
                        brightness: Math.random(),
                        twinkleSpeed: Math.random() * 0.03 + 0.01,
                        twinkleOffset: Math.random() * Math.PI * 2
                    });
                }
            }

            // Initialize stars
            generateStars();

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                rawScore = 0;
                scoreDisplay.textContent = '0';
                particles = [];
                thrusterParticles = [];
                spawnFood();
            }

            // Spawn food at random position not occupied by snake
            function spawnFood() {
                var newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }));
                food = newFood;
                foodType = Math.floor(Math.random() * 3); // cycle through types
            }

            // Create particle burst when food is collected
            function createFoodParticles(x, y) {
                var colors = ['#00e5ff', '#7c4dff', '#ff4081', '#ffab40', '#69f0ae'];
                for (var i = 0; i < 12; i++) {
                    var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                    var speed = Math.random() * 3 + 1.5;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: Math.random() * 0.03 + 0.02,
                        size: Math.random() * 3 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            // Create thruster particles behind the snake head
            function createThrusterParticle() {
                if (!gameRunning || snake.length === 0) return;
                var head = snake[0];
                var cx = head.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = head.y * CELL_SIZE + CELL_SIZE / 2;
                // Place particles behind the direction of travel
                var offsetX = -direction.x * CELL_SIZE * 0.4;
                var offsetY = -direction.y * CELL_SIZE * 0.4;
                for (var i = 0; i < 2; i++) {
                    thrusterParticles.push({
                        x: cx + offsetX + (Math.random() - 0.5) * 6,
                        y: cy + offsetY + (Math.random() - 0.5) * 6,
                        vx: -direction.x * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        vy: -direction.y * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        life: 1.0,
                        decay: Math.random() * 0.05 + 0.04,
                        size: Math.random() * 2.5 + 1
                    });
                }
            }

            // Update particles
            function updateParticles() {
                // Food particles
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life -= particles[i].decay;
                    particles[i].vx *= 0.96;
                    particles[i].vy *= 0.96;
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                // Thruster particles
                for (var j = thrusterParticles.length - 1; j >= 0; j--) {
                    thrusterParticles[j].x += thrusterParticles[j].vx;
                    thrusterParticles[j].y += thrusterParticles[j].vy;
                    thrusterParticles[j].life -= thrusterParticles[j].decay;
                    if (thrusterParticles[j].life <= 0) {
                        thrusterParticles.splice(j, 1);
                    }
                }
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Create thruster particles
                createThrusterParticle();

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    rawScore++;
                    score = rawScore * scoreMultiplier;
                    scoreDisplay.textContent = score;
                    // Create particle burst at food position
                    createFoodParticles(
                        food.x * CELL_SIZE + CELL_SIZE / 2,
                        food.y * CELL_SIZE + CELL_SIZE / 2
                    );
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Draw starfield background
            function drawStarfield() {
                // Deep space background
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Subtle nebula gradient
                var nebula = ctx.createRadialGradient(200, 200, 50, 200, 200, 250);
                nebula.addColorStop(0, 'rgba(26, 0, 51, 0.3)');
                nebula.addColorStop(0.5, 'rgba(10, 10, 40, 0.2)');
                nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = nebula;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Draw stars with twinkling
                var time = Date.now() * 0.001;
                for (var i = 0; i < stars.length; i++) {
                    var star = stars[i];
                    var twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.5 + 0.5;
                    var alpha = star.brightness * 0.4 + twinkle * 0.6;
                    // Scroll effect - slight vertical drift
                    var yPos = (star.y + starfieldOffset * star.size * 0.3) % CANVAS_SIZE;
                    if (yPos < 0) yPos += CANVAS_SIZE;

                    ctx.beginPath();
                    ctx.arc(star.x, yPos, star.size * (0.5 + twinkle * 0.5), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200, 220, 255, ' + alpha + ')';
                    ctx.fill();

                    // Add glow to brighter stars
                    if (star.size > 1.5) {
                        ctx.beginPath();
                        ctx.arc(star.x, yPos, star.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(150, 180, 255, ' + (alpha * 0.2) + ')';
                        ctx.fill();
                    }
                }

                // Very subtle grid (faint blue lines)
                ctx.strokeStyle = 'rgba(30, 40, 80, 0.15)';
                ctx.lineWidth = 0.3;
                for (var g = 0; g <= GRID_SIZE; g++) {
                    ctx.beginPath();
                    ctx.moveTo(g * CELL_SIZE, 0);
                    ctx.lineTo(g * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, g * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, g * CELL_SIZE);
                    ctx.stroke();
                }
            }

            // Draw food as space objects
            function drawFood() {
                var fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                var fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                var radius = CELL_SIZE / 2 - 2;
                foodPulse += 0.08;
                var pulse = Math.sin(foodPulse) * 0.2 + 0.8;

                ctx.save();

                if (foodType === 0) {
                    // Planet with rings
                    // Glow
                    ctx.shadowColor = '#ff6e40';
                    ctx.shadowBlur = 12 * pulse;
                    // Planet body
                    var planetGrad = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, radius);
                    planetGrad.addColorStop(0, '#ff8a65');
                    planetGrad.addColorStop(0.6, '#d84315');
                    planetGrad.addColorStop(1, '#bf360c');
                    ctx.fillStyle = planetGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, radius * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Ring
                    ctx.strokeStyle = 'rgba(255, 171, 64, 0.7)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(fx, fy, radius * 1.3 * pulse, radius * 0.4 * pulse, -0.3, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (foodType === 1) {
                    // 5-pointed star
                    ctx.shadowColor = '#ffeb3b';
                    ctx.shadowBlur = 15 * pulse;
                    ctx.fillStyle = '#fdd835';
                    ctx.beginPath();
                    for (var p = 0; p < 5; p++) {
                        var outerAngle = (Math.PI * 2 / 5) * p - Math.PI / 2;
                        var innerAngle = outerAngle + Math.PI / 5;
                        var outerR = radius * pulse;
                        var innerR = radius * 0.4 * pulse;
                        if (p === 0) {
                            ctx.moveTo(fx + Math.cos(outerAngle) * outerR, fy + Math.sin(outerAngle) * outerR);
                        } else {
                            ctx.lineTo(fx + Math.cos(outerAngle) * outerR, fy + Math.sin(outerAngle) * outerR);
                        }
                        ctx.lineTo(fx + Math.cos(innerAngle) * innerR, fy + Math.sin(innerAngle) * innerR);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    // Energy orb (pulsating cyan/purple)
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 18 * pulse;
                    var orbGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius * pulse);
                    orbGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                    orbGrad.addColorStop(0.3, 'rgba(0, 229, 255, 0.8)');
                    orbGrad.addColorStop(0.7, 'rgba(124, 77, 255, 0.6)');
                    orbGrad.addColorStop(1, 'rgba(124, 77, 255, 0)');
                    ctx.fillStyle = orbGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, radius * 1.2 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    // Inner core
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(fx, fy, radius * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Draw snake head as a spaceship
            function drawSnakeHead(segment) {
                var cx = segment.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = segment.y * CELL_SIZE + CELL_SIZE / 2;
                var size = CELL_SIZE / 2 - 1;

                ctx.save();

                // Translate and rotate based on direction
                ctx.translate(cx, cy);
                var angle = 0;
                if (direction.x === 1) angle = 0;
                else if (direction.x === -1) angle = Math.PI;
                else if (direction.y === -1) angle = -Math.PI / 2;
                else if (direction.y === 1) angle = Math.PI / 2;
                ctx.rotate(angle);

                // Glow effect
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;

                // Ship body (triangle/arrow pointing right)
                ctx.beginPath();
                ctx.moveTo(size, 0); // Nose
                ctx.lineTo(-size * 0.7, -size * 0.7); // Top wing
                ctx.lineTo(-size * 0.3, 0); // Indent
                ctx.lineTo(-size * 0.7, size * 0.7); // Bottom wing
                ctx.closePath();

                // Gradient fill
                var shipGrad = ctx.createLinearGradient(-size, 0, size, 0);
                shipGrad.addColorStop(0, '#1a237e');
                shipGrad.addColorStop(0.5, '#00bcd4');
                shipGrad.addColorStop(1, '#00e5ff');
                ctx.fillStyle = shipGrad;
                ctx.fill();

                // Outline
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // Cockpit/windshield
                ctx.beginPath();
                ctx.arc(size * 0.2, 0, size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();

                // Engine glow at the back
                ctx.beginPath();
                ctx.arc(-size * 0.4, 0, size * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 100, 0, 0.6)';
                ctx.fill();

                ctx.restore();
            }

            // Draw snake body as comet/energy trail
            function drawSnakeBody() {
                for (var index = 1; index < snake.length; index++) {
                    var segment = snake[index];
                    var x = segment.x * CELL_SIZE + CELL_SIZE / 2;
                    var y = segment.y * CELL_SIZE + CELL_SIZE / 2;
                    var progress = index / snake.length; // 0 at head, 1 at tail

                    // Fade from bright blue-purple near head to dim toward tail
                    var alpha = 1 - progress * 0.7;
                    var size = (CELL_SIZE / 2 - 2) * (1 - progress * 0.3);

                    ctx.save();

                    // Outer glow
                    ctx.shadowColor = 'rgba(100, 50, 255, ' + (alpha * 0.5) + ')';
                    ctx.shadowBlur = 8 * (1 - progress);

                    // Gradient orb for each segment
                    var segGrad = ctx.createRadialGradient(x, y, 0, x, y, size);
                    // Shift from cyan (near head) to purple (near tail)
                    var r = Math.floor(30 + progress * 100);
                    var g = Math.floor(200 - progress * 150);
                    var b = Math.floor(255);
                    segGrad.addColorStop(0, 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')');
                    segGrad.addColorStop(0.6, 'rgba(' + Math.floor(r * 0.5) + ', ' + Math.floor(g * 0.3) + ', ' + b + ', ' + (alpha * 0.7) + ')');
                    segGrad.addColorStop(1, 'rgba(' + Math.floor(r * 0.3) + ', ' + Math.floor(g * 0.1) + ', ' + Math.floor(b * 0.8) + ', 0)');

                    ctx.fillStyle = segGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, size * 1.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright core
                    ctx.fillStyle = 'rgba(200, 230, 255, ' + (alpha * 0.4) + ')';
                    ctx.beginPath();
                    ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Draw particles
            function drawParticles() {
                // Food collection particles
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Thruster particles
                for (var j = 0; j < thrusterParticles.length; j++) {
                    var tp = thrusterParticles[j];
                    ctx.save();
                    ctx.globalAlpha = tp.life * 0.7;
                    var tpColor = tp.life > 0.5 ? 'rgba(255, 150, 0, ' + tp.life + ')' : 'rgba(255, 50, 0, ' + tp.life + ')';
                    ctx.fillStyle = tpColor;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, tp.size * tp.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Draw everything
            function draw() {
                // Draw starfield background
                drawStarfield();

                // Draw particles (behind snake and food)
                drawParticles();

                // Draw food
                drawFood();

                // Draw snake body (before head so head overlaps)
                drawSnakeBody();

                // Draw snake head
                if (snake.length > 0) {
                    drawSnakeHead(snake[0]);
                }
            }

            // Animation loop for starfield scrolling and particle updates (runs independently)
            function animateBackground() {
                starfieldOffset += 0.3;
                updateParticles();
                if (gameRunning) {
                    // Redraw is handled by the game loop
                } else {
                    // When game is not running, still animate the background
                    draw();
                }
                animationFrame = requestAnimationFrame(animateBackground);
            }

            // Select difficulty and start the game
            function selectDifficulty(level) {
                var settings = DIFFICULTY_SETTINGS[level];
                if (!settings) return;

                currentDifficulty = level;
                gameSpeed = settings.speed;
                scoreMultiplier = settings.multiplier;
                difficultySelected = true;

                // Update the difficulty label in the header
                difficultyLabel.textContent = settings.label;
                difficultyLabel.className = 'difficulty-label ' + settings.cssClass;

                // Hide difficulty screen and start the game
                difficultyScreen.classList.add('hidden');
                startGame();
            }

            // Show the difficulty selection screen
            function showDifficultyScreen() {
                gameStarted = false;
                difficultySelected = false;
                gameOverScreen.classList.add('hidden');
                difficultyScreen.classList.remove('hidden');
                difficultyLabel.classList.add('hidden');
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                initGame();
                gameRunning = true;
                gameStarted = true;
                difficultyScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                draw();
                gameLoop = setInterval(function() {
                    update();
                    if (gameRunning) {
                        draw();
                    }
                }, gameSpeed);
            }

            // Restart game at same difficulty
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Difficulty selection keys (1, 2, 3) when on difficulty screen
                if (!difficultySelected && !gameStarted) {
                    if (e.key === '1') {
                        selectDifficulty('easy');
                        e.preventDefault();
                        return;
                    } else if (e.key === '2') {
                        selectDifficulty('medium');
                        e.preventDefault();
                        return;
                    } else if (e.key === '3') {
                        selectDifficulty('hard');
                        e.preventDefault();
                        return;
                    }
                }

                // Arrow keys should only work after difficulty is selected
                // Start game on arrow key if difficulty selected but game not yet started
                // (This handles the case where the game was just restarted)
                if (difficultySelected && !gameRunning && !gameStarted) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        startGame();
                        if (e.key === 'ArrowUp' && direction.y !== 1) {
                            nextDirection = { x: 0, y: -1 };
                        } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                            nextDirection = { x: 0, y: 1 };
                        } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                            nextDirection = { x: -1, y: 0 };
                        } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                            nextDirection = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        return;
                    }
                }

                // Restart on Enter when game over, Escape to change difficulty
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }
                if (!gameRunning && gameStarted && e.key === 'Escape') {
                    showDifficultyScreen();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers - Difficulty selection
            easyBtn.addEventListener('click', function() { selectDifficulty('easy'); });
            mediumBtn.addEventListener('click', function() { selectDifficulty('medium'); });
            hardBtn.addEventListener('click', function() { selectDifficulty('hard'); });

            // Button handlers - Game over
            restartBtn.addEventListener('click', restartGame);
            changeDifficultyBtn.addEventListener('click', showDifficultyScreen);

            // Start background animation
            animateBackground();

            // Draw initial state
            draw();
        })();
    </script>
</body>
</html>
