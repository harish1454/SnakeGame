<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at top, #0d3b2e 0%, #0a2a20 55%, #06160f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f5f5f5;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.6), 0 0 20px rgba(76, 217, 100, 0.3);
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .difficulty-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid;
        }

        .difficulty-label.hidden {
            display: none;
        }

        .difficulty-label.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            text-shadow: 0 0 6px rgba(105, 240, 174, 0.5);
        }

        .difficulty-label.medium {
            color: #ffab40;
            border-color: #ffab40;
            text-shadow: 0 0 6px rgba(255, 171, 64, 0.5);
        }

        .difficulty-label.hard {
            color: #ff5252;
            border-color: #ff5252;
            text-shadow: 0 0 6px rgba(255, 82, 82, 0.5);
        }

        .score-display {
            font-size: 20px;
            color: #ffd54f;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 213, 79, 0.5);
        }

        canvas {
            border: 2px solid #c62828;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(255, 213, 79, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(13, 59, 46, 0.95) 0%, rgba(6, 22, 15, 0.98) 100%);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #ff4d4d;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.7), 0 0 30px rgba(76, 217, 100, 0.4);
            letter-spacing: 3px;
        }

        .overlay p {
            font-size: 16px;
            color: #e0f2e9;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #ffd54f;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 213, 79, 0.5);
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #4cd964;
            background: transparent;
            border: 2px solid #4cd964;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(76, 217, 100, 0.3), inset 0 0 10px rgba(76, 217, 100, 0.1);
        }

        .btn:hover {
            background: rgba(76, 217, 100, 0.15);
            box-shadow: 0 0 20px rgba(76, 217, 100, 0.6), inset 0 0 15px rgba(76, 217, 100, 0.2);
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(76, 217, 100, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .difficulty-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .difficulty-btn .diff-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .difficulty-btn .diff-name {
            font-size: 16px;
        }

        .difficulty-btn .diff-desc {
            font-size: 11px;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.7;
        }

        .difficulty-btn .diff-key {
            font-size: 12px;
            opacity: 0.5;
            font-weight: normal;
        }

        .difficulty-btn.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            box-shadow: 0 0 10px rgba(105, 240, 174, 0.3), inset 0 0 10px rgba(105, 240, 174, 0.1);
        }

        .difficulty-btn.easy:hover {
            background: rgba(105, 240, 174, 0.15);
            box-shadow: 0 0 20px rgba(105, 240, 174, 0.6), inset 0 0 15px rgba(105, 240, 174, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(105, 240, 174, 0.8);
        }

        .difficulty-btn.medium {
            color: #ffab40;
            border-color: #ffab40;
            box-shadow: 0 0 10px rgba(255, 171, 64, 0.3), inset 0 0 10px rgba(255, 171, 64, 0.1);
        }

        .difficulty-btn.medium:hover {
            background: rgba(255, 171, 64, 0.15);
            box-shadow: 0 0 20px rgba(255, 171, 64, 0.6), inset 0 0 15px rgba(255, 171, 64, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 171, 64, 0.8);
        }

        .difficulty-btn.hard {
            color: #ff5252;
            border-color: #ff5252;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3), inset 0 0 10px rgba(255, 82, 82, 0.1);
        }

        .difficulty-btn.hard:hover {
            background: rgba(255, 82, 82, 0.15);
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.6), inset 0 0 15px rgba(255, 82, 82, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 82, 82, 0.8);
        }

        .difficulty-btn:active {
            transform: scale(0.97);
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #ffd54f;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .game-over-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .btn-secondary {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: bold;
            color: #e0f2e9;
            background: transparent;
            border: 1px solid #c62828;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(198, 40, 40, 0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-secondary:hover {
            color: #ffffff;
            border-color: #ff4d4d;
            background: rgba(198, 40, 40, 0.18);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
            transform: scale(1.05);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #9ccc9c;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎄 CHRISTMAS SNAKE</div>
            <div class="header-right">
                <span class="difficulty-label hidden" id="difficultyLabel"></span>
                <div class="score-display">Gifts: <span id="score">0</span></div>
            </div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="difficultyScreen">
                <h2>🎁 MERRY SNAKEMAS</h2>
                <div class="overlay-subtitle">Choose Your Festive Challenge</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn easy" id="easyBtn" data-difficulty="easy">
                        <div class="diff-info">
                            <span class="diff-name">Elf</span>
                            <span class="diff-desc">Slow speed, 1x gift multiplier</span>
                        </div>
                        <span class="diff-key">[ 1 ]</span>
                    </button>
                    <button class="difficulty-btn medium" id="mediumBtn" data-difficulty="medium">
                        <div class="diff-info">
                            <span class="diff-name">Reindeer</span>
                            <span class="diff-desc">Normal speed, 2x gift multiplier</span>
                        </div>
                        <span class="diff-key">[ 2 ]</span>
                    </button>
                    <button class="difficulty-btn hard" id="hardBtn" data-difficulty="hard">
                        <div class="diff-info">
                            <span class="diff-name">Santa</span>
                            <span class="diff-desc">Fast speed, 3x gift multiplier</span>
                        </div>
                        <span class="diff-key">[ 3 ]</span>
                    </button>
                </div>
                <div class="instructions">Press 1, 2, or 3 to select</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>❄️ GAME OVER</h2>
                <p class="final-score">Gifts Collected: <span id="finalScore">0</span></p>
                <div class="game-over-buttons">
                    <button class="btn" id="restartBtn">Play Again</button>
                    <button class="btn-secondary" id="changeDifficultyBtn">Change Challenge</button>
                </div>
                <div class="instructions">Press Enter to play again or Esc to change challenge</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

            // Difficulty settings
            const DIFFICULTY_SETTINGS = {
                easy:   { speed: 150, multiplier: 1, label: 'Elf',      color: '#69f0ae', cssClass: 'easy' },
                medium: { speed: 120, multiplier: 2, label: 'Reindeer', color: '#ffab40', cssClass: 'medium' },
                hard:   { speed: 80,  multiplier: 3, label: 'Santa',    color: '#ff5252', cssClass: 'hard' }
            };

            // Current difficulty state
            let currentDifficulty = null; // 'easy', 'medium', or 'hard'
            let gameSpeed = 120;
            let scoreMultiplier = 1;

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let rawScore = 0; // Score before multiplier
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;
            let difficultySelected = false;

            // Christmas theme state
            let stars = []; // snowflakes
            let particles = [];
            let thrusterParticles = []; // sparkle trail behind the snake
            let foodType = 0; // 0 = present, 1 = ornament, 2 = candy cane
            let foodPulse = 0;
            let starfieldOffset = 0; // snowfall offset
            let animationFrame = null;

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const difficultyScreen = document.getElementById('difficultyScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const difficultyLabel = document.getElementById('difficultyLabel');
            const easyBtn = document.getElementById('easyBtn');
            const mediumBtn = document.getElementById('mediumBtn');
            const hardBtn = document.getElementById('hardBtn');
            const restartBtn = document.getElementById('restartBtn');
            const changeDifficultyBtn = document.getElementById('changeDifficultyBtn');

            // Generate falling snowflakes
            function generateStars() {
                stars = [];
                for (var i = 0; i < 120; i++) {
                    stars.push({
                        x: Math.random() * CANVAS_SIZE,
                        y: Math.random() * CANVAS_SIZE,
                        size: Math.random() * 2.2 + 0.8,
                        brightness: Math.random(),
                        twinkleSpeed: Math.random() * 0.03 + 0.01,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        drift: Math.random() * 0.6 + 0.2,
                        sway: Math.random() * Math.PI * 2
                    });
                }
            }

            // Initialize snowflakes
            generateStars();

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                rawScore = 0;
                scoreDisplay.textContent = '0';
                particles = [];
                thrusterParticles = [];
                spawnFood();
            }

            // Spawn food at random position not occupied by snake
            function spawnFood() {
                var newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }));
                food = newFood;
                foodType = Math.floor(Math.random() * 3); // cycle through types
            }

            // Create particle burst when food is collected
            function createFoodParticles(x, y) {
                var colors = ['#ff4d4d', '#4cd964', '#ffd54f', '#ffffff', '#e53935'];
                for (var i = 0; i < 12; i++) {
                    var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                    var speed = Math.random() * 3 + 1.5;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: Math.random() * 0.03 + 0.02,
                        size: Math.random() * 3 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            // Create thruster particles behind the snake head
            function createThrusterParticle() {
                if (!gameRunning || snake.length === 0) return;
                var head = snake[0];
                var cx = head.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = head.y * CELL_SIZE + CELL_SIZE / 2;
                // Place particles behind the direction of travel
                var offsetX = -direction.x * CELL_SIZE * 0.4;
                var offsetY = -direction.y * CELL_SIZE * 0.4;
                for (var i = 0; i < 2; i++) {
                    thrusterParticles.push({
                        x: cx + offsetX + (Math.random() - 0.5) * 6,
                        y: cy + offsetY + (Math.random() - 0.5) * 6,
                        vx: -direction.x * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        vy: -direction.y * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        life: 1.0,
                        decay: Math.random() * 0.05 + 0.04,
                        size: Math.random() * 2.5 + 1
                    });
                }
            }

            // Update particles
            function updateParticles() {
                // Food particles
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life -= particles[i].decay;
                    particles[i].vx *= 0.96;
                    particles[i].vy *= 0.96;
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                // Thruster particles
                for (var j = thrusterParticles.length - 1; j >= 0; j--) {
                    thrusterParticles[j].x += thrusterParticles[j].vx;
                    thrusterParticles[j].y += thrusterParticles[j].vy;
                    thrusterParticles[j].life -= thrusterParticles[j].decay;
                    if (thrusterParticles[j].life <= 0) {
                        thrusterParticles.splice(j, 1);
                    }
                }
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Create thruster particles
                createThrusterParticle();

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    rawScore++;
                    score = rawScore * scoreMultiplier;
                    scoreDisplay.textContent = score;
                    // Create particle burst at food position
                    createFoodParticles(
                        food.x * CELL_SIZE + CELL_SIZE / 2,
                        food.y * CELL_SIZE + CELL_SIZE / 2
                    );
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Draw snowy night background
            function drawStarfield() {
                // Deep festive green night sky
                ctx.fillStyle = '#06160f';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Soft green glow gradient
                var nebula = ctx.createRadialGradient(200, 160, 40, 200, 200, 260);
                nebula.addColorStop(0, 'rgba(20, 83, 45, 0.45)');
                nebula.addColorStop(0.5, 'rgba(13, 59, 46, 0.25)');
                nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = nebula;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Draw drifting, twinkling snowflakes
                var time = Date.now() * 0.001;
                for (var i = 0; i < stars.length; i++) {
                    var star = stars[i];
                    var twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.5 + 0.5;
                    var alpha = star.brightness * 0.4 + twinkle * 0.6;
                    // Snowfall - vertical drift plus gentle horizontal sway
                    var yPos = (star.y + starfieldOffset * star.drift) % CANVAS_SIZE;
                    if (yPos < 0) yPos += CANVAS_SIZE;
                    var xPos = star.x + Math.sin(time + star.sway) * 4;

                    ctx.beginPath();
                    ctx.arc(xPos, yPos, star.size * (0.6 + twinkle * 0.4), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
                    ctx.fill();

                    // Add soft halo to larger snowflakes
                    if (star.size > 1.6) {
                        ctx.beginPath();
                        ctx.arc(xPos, yPos, star.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(220, 240, 255, ' + (alpha * 0.2) + ')';
                        ctx.fill();
                    }
                }

                // Very subtle grid (faint green lines)
                ctx.strokeStyle = 'rgba(76, 217, 100, 0.12)';
                ctx.lineWidth = 0.3;
                for (var g = 0; g <= GRID_SIZE; g++) {
                    ctx.beginPath();
                    ctx.moveTo(g * CELL_SIZE, 0);
                    ctx.lineTo(g * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, g * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, g * CELL_SIZE);
                    ctx.stroke();
                }
            }

            // Draw food as festive Christmas treats
            function drawFood() {
                var fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                var fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                var radius = CELL_SIZE / 2 - 2;
                foodPulse += 0.08;
                var pulse = Math.sin(foodPulse) * 0.2 + 0.8;

                ctx.save();

                if (foodType === 0) {
                    // Wrapped present (red box, gold ribbon)
                    var s = radius * pulse;
                    ctx.shadowColor = '#ff4d4d';
                    ctx.shadowBlur = 12 * pulse;
                    // Box
                    ctx.fillStyle = '#e53935';
                    ctx.fillRect(fx - s, fy - s * 0.85, s * 2, s * 1.85);
                    ctx.shadowBlur = 0;
                    // Ribbon (vertical + horizontal)
                    ctx.fillStyle = '#ffd54f';
                    ctx.fillRect(fx - s * 0.18, fy - s * 0.85, s * 0.36, s * 1.85);
                    ctx.fillRect(fx - s, fy - s * 0.18, s * 2, s * 0.36);
                    // Bow
                    ctx.fillStyle = '#fff176';
                    ctx.beginPath();
                    ctx.arc(fx - s * 0.3, fy - s * 0.85, s * 0.3, 0, Math.PI * 2);
                    ctx.arc(fx + s * 0.3, fy - s * 0.85, s * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (foodType === 1) {
                    // Christmas tree ornament (shiny green ball with cap)
                    ctx.shadowColor = '#4cd964';
                    ctx.shadowBlur = 15 * pulse;
                    var ornGrad = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, radius * pulse);
                    ornGrad.addColorStop(0, '#a5ffb0');
                    ornGrad.addColorStop(0.6, '#2e9e4f');
                    ornGrad.addColorStop(1, '#1b7a37');
                    ctx.fillStyle = ornGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy + radius * 0.15, radius * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Highlight
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.beginPath();
                    ctx.arc(fx - radius * 0.3, fy - radius * 0.15, radius * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                    // Gold cap
                    ctx.fillStyle = '#ffd54f';
                    ctx.fillRect(fx - radius * 0.25, fy - radius * pulse - radius * 0.1, radius * 0.5, radius * 0.4);
                } else {
                    // Candy cane (white with red stripes, hooked top)
                    ctx.shadowColor = '#ff4d4d';
                    ctx.shadowBlur = 14 * pulse;
                    var w = radius * 0.5 * pulse;
                    ctx.lineWidth = w;
                    ctx.lineCap = 'round';
                    // White base stroke (shaft + hook)
                    ctx.strokeStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(fx + radius * 0.3, fy + radius * 0.8);
                    ctx.lineTo(fx + radius * 0.3, fy - radius * 0.2);
                    ctx.arc(fx, fy - radius * 0.2, radius * 0.3, 0, Math.PI, true);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    // Red diagonal stripes
                    ctx.strokeStyle = '#e53935';
                    ctx.lineWidth = w * 0.45;
                    for (var c = 0; c < 4; c++) {
                        var sy = fy + radius * 0.6 - c * radius * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(fx + radius * 0.1, sy);
                        ctx.lineTo(fx + radius * 0.5, sy - radius * 0.2);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }

            // Draw snake head as a festive head wearing a Santa hat
            function drawSnakeHead(segment) {
                var cx = segment.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = segment.y * CELL_SIZE + CELL_SIZE / 2;
                var size = CELL_SIZE / 2 - 1;

                ctx.save();

                // Translate and rotate based on direction
                ctx.translate(cx, cy);
                var angle = 0;
                if (direction.x === 1) angle = 0;
                else if (direction.x === -1) angle = Math.PI;
                else if (direction.y === -1) angle = -Math.PI / 2;
                else if (direction.y === 1) angle = Math.PI / 2;
                ctx.rotate(angle);

                // Glow effect
                ctx.shadowColor = '#4cd964';
                ctx.shadowBlur = 12;

                // Rounded green head
                var headGrad = ctx.createRadialGradient(-size * 0.2, -size * 0.2, 1, 0, 0, size);
                headGrad.addColorStop(0, '#8aff9a');
                headGrad.addColorStop(0.6, '#2e9e4f');
                headGrad.addColorStop(1, '#1b7a37');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1b7a37';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Eyes (toward the nose / direction of travel, +x)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(size * 0.35, -size * 0.3, size * 0.22, 0, Math.PI * 2);
                ctx.arc(size * 0.35, size * 0.3, size * 0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#06160f';
                ctx.beginPath();
                ctx.arc(size * 0.45, -size * 0.3, size * 0.1, 0, Math.PI * 2);
                ctx.arc(size * 0.45, size * 0.3, size * 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Santa hat sits on top of the head (-x side, the "back")
                // Red cap
                ctx.fillStyle = '#e53935';
                ctx.beginPath();
                ctx.moveTo(-size * 0.1, -size * 0.75);
                ctx.lineTo(-size * 0.1, size * 0.75);
                ctx.lineTo(-size * 1.1, 0);
                ctx.closePath();
                ctx.fill();
                // White fur trim
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-size * 0.25, -size * 0.8, size * 0.28, size * 1.6);
                // White pom-pom at the tip
                ctx.beginPath();
                ctx.arc(-size * 1.1, 0, size * 0.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Draw snake body as a festive red-and-green garland
            function drawSnakeBody() {
                for (var index = 1; index < snake.length; index++) {
                    var segment = snake[index];
                    var x = segment.x * CELL_SIZE + CELL_SIZE / 2;
                    var y = segment.y * CELL_SIZE + CELL_SIZE / 2;
                    var progress = index / snake.length; // 0 at head, 1 at tail

                    // Fade slightly toward the tail
                    var alpha = 1 - progress * 0.6;
                    var size = (CELL_SIZE / 2 - 2) * (1 - progress * 0.3);

                    // Alternate red and green beads like a garland
                    var isRed = index % 2 === 1;
                    var coreColor, midColor, glowColor;
                    if (isRed) {
                        coreColor = '#ff8a8a';
                        midColor = '#e53935';
                        glowColor = 'rgba(229, 57, 53, ';
                    } else {
                        coreColor = '#a5ffb0';
                        midColor = '#2e9e4f';
                        glowColor = 'rgba(46, 158, 79, ';
                    }

                    ctx.save();

                    // Outer glow
                    ctx.shadowColor = glowColor + (alpha * 0.6) + ')';
                    ctx.shadowBlur = 8 * (1 - progress);

                    // Gradient bead for each segment
                    var segGrad = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, 0, x, y, size);
                    segGrad.addColorStop(0, coreColor);
                    segGrad.addColorStop(0.7, midColor);
                    segGrad.addColorStop(1, glowColor + alpha + ')');

                    ctx.fillStyle = segGrad;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Glossy highlight
                    ctx.globalAlpha = alpha * 0.6;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.beginPath();
                    ctx.arc(x - size * 0.3, y - size * 0.3, size * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Draw particles
            function drawParticles() {
                // Food collection particles
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Thruster particles
                for (var j = 0; j < thrusterParticles.length; j++) {
                    var tp = thrusterParticles[j];
                    ctx.save();
                    ctx.globalAlpha = tp.life * 0.7;
                    var tpColor = tp.life > 0.5 ? 'rgba(255, 245, 200, ' + tp.life + ')' : 'rgba(255, 213, 79, ' + tp.life + ')';
                    ctx.fillStyle = tpColor;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, tp.size * tp.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Draw everything
            function draw() {
                // Draw starfield background
                drawStarfield();

                // Draw particles (behind snake and food)
                drawParticles();

                // Draw food
                drawFood();

                // Draw snake body (before head so head overlaps)
                drawSnakeBody();

                // Draw snake head
                if (snake.length > 0) {
                    drawSnakeHead(snake[0]);
                }
            }

            // Animation loop for starfield scrolling and particle updates (runs independently)
            function animateBackground() {
                starfieldOffset += 0.3;
                updateParticles();
                if (gameRunning) {
                    // Redraw is handled by the game loop
                } else {
                    // When game is not running, still animate the background
                    draw();
                }
                animationFrame = requestAnimationFrame(animateBackground);
            }

            // Select difficulty and start the game
            function selectDifficulty(level) {
                var settings = DIFFICULTY_SETTINGS[level];
                if (!settings) return;

                currentDifficulty = level;
                gameSpeed = settings.speed;
                scoreMultiplier = settings.multiplier;
                difficultySelected = true;

                // Update the difficulty label in the header
                difficultyLabel.textContent = settings.label;
                difficultyLabel.className = 'difficulty-label ' + settings.cssClass;

                // Hide difficulty screen and start the game
                difficultyScreen.classList.add('hidden');
                startGame();
            }

            // Show the difficulty selection screen
            function showDifficultyScreen() {
                gameStarted = false;
                difficultySelected = false;
                gameOverScreen.classList.add('hidden');
                difficultyScreen.classList.remove('hidden');
                difficultyLabel.classList.add('hidden');
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                initGame();
                gameRunning = true;
                gameStarted = true;
                difficultyScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                draw();
                gameLoop = setInterval(function() {
                    update();
                    if (gameRunning) {
                        draw();
                    }
                }, gameSpeed);
            }

            // Restart game at same difficulty
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Difficulty selection keys (1, 2, 3) when on difficulty screen
                if (!difficultySelected && !gameStarted) {
                    if (e.key === '1') {
                        selectDifficulty('easy');
                        e.preventDefault();
                        return;
                    } else if (e.key === '2') {
                        selectDifficulty('medium');
                        e.preventDefault();
                        return;
                    } else if (e.key === '3') {
                        selectDifficulty('hard');
                        e.preventDefault();
                        return;
                    }
                }

                // Arrow keys should only work after difficulty is selected
                // Start game on arrow key if difficulty selected but game not yet started
                // (This handles the case where the game was just restarted)
                if (difficultySelected && !gameRunning && !gameStarted) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        startGame();
                        if (e.key === 'ArrowUp' && direction.y !== 1) {
                            nextDirection = { x: 0, y: -1 };
                        } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                            nextDirection = { x: 0, y: 1 };
                        } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                            nextDirection = { x: -1, y: 0 };
                        } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                            nextDirection = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        return;
                    }
                }

                // Restart on Enter when game over, Escape to change difficulty
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }
                if (!gameRunning && gameStarted && e.key === 'Escape') {
                    showDifficultyScreen();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers - Difficulty selection
            easyBtn.addEventListener('click', function() { selectDifficulty('easy'); });
            mediumBtn.addEventListener('click', function() { selectDifficulty('medium'); });
            hardBtn.addEventListener('click', function() { selectDifficulty('hard'); });

            // Button handlers - Game over
            restartBtn.addEventListener('click', restartGame);
            changeDifficultyBtn.addEventListener('click', showDifficultyScreen);

            // Start background animation
            animateBackground();

            // Draw initial state
            draw();
        })();
    </script>
</body>
</html>
