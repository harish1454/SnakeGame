<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aussie Serpent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b1a0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f0e0c8;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #cc7722;
            text-shadow: 0 0 10px rgba(204, 119, 34, 0.5), 0 0 20px rgba(204, 119, 34, 0.3);
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .difficulty-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid;
        }

        .difficulty-label.hidden {
            display: none;
        }

        .difficulty-label.easy {
            color: #7cb342;
            border-color: #7cb342;
            text-shadow: 0 0 6px rgba(124, 179, 66, 0.5);
        }

        .difficulty-label.medium {
            color: #cc7722;
            border-color: #cc7722;
            text-shadow: 0 0 6px rgba(204, 119, 34, 0.5);
        }

        .difficulty-label.hard {
            color: #c0532a;
            border-color: #c0532a;
            text-shadow: 0 0 6px rgba(192, 83, 42, 0.5);
        }

        .score-display {
            font-size: 20px;
            color: #cc7722;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(204, 119, 34, 0.4);
        }

        .high-score-display {
            font-size: 14px;
            color: #d4a55a;
            font-weight: bold;
            text-shadow: 0 0 6px rgba(212, 165, 90, 0.3);
        }

        canvas {
            border: 2px solid #8b5e3c;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(139, 94, 60, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(43, 26, 14, 0.96) 0%, rgba(30, 15, 5, 0.98) 100%);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #cc7722;
            text-shadow: 0 0 15px rgba(204, 119, 34, 0.7), 0 0 30px rgba(204, 119, 34, 0.4);
            letter-spacing: 3px;
        }

        .overlay p {
            font-size: 16px;
            color: #d4a55a;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #cc7722;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(204, 119, 34, 0.5);
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #cc7722;
            background: transparent;
            border: 2px solid #cc7722;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(204, 119, 34, 0.3), inset 0 0 10px rgba(204, 119, 34, 0.1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn:hover {
            background: rgba(204, 119, 34, 0.15);
            box-shadow: 0 0 20px rgba(204, 119, 34, 0.6), inset 0 0 15px rgba(204, 119, 34, 0.2);
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(204, 119, 34, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .difficulty-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .difficulty-btn .diff-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .difficulty-btn .diff-name {
            font-size: 16px;
        }

        .difficulty-btn .diff-desc {
            font-size: 11px;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.7;
        }

        .difficulty-btn .diff-key {
            font-size: 12px;
            opacity: 0.5;
            font-weight: normal;
        }

        .difficulty-btn.easy {
            color: #7cb342;
            border-color: #7cb342;
            box-shadow: 0 0 10px rgba(124, 179, 66, 0.3), inset 0 0 10px rgba(124, 179, 66, 0.1);
        }

        .difficulty-btn.easy:hover {
            background: rgba(124, 179, 66, 0.15);
            box-shadow: 0 0 20px rgba(124, 179, 66, 0.6), inset 0 0 15px rgba(124, 179, 66, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(124, 179, 66, 0.8);
        }

        .difficulty-btn.medium {
            color: #cc7722;
            border-color: #cc7722;
            box-shadow: 0 0 10px rgba(204, 119, 34, 0.3), inset 0 0 10px rgba(204, 119, 34, 0.1);
        }

        .difficulty-btn.medium:hover {
            background: rgba(204, 119, 34, 0.15);
            box-shadow: 0 0 20px rgba(204, 119, 34, 0.6), inset 0 0 15px rgba(204, 119, 34, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(204, 119, 34, 0.8);
        }

        .difficulty-btn.hard {
            color: #c0532a;
            border-color: #c0532a;
            box-shadow: 0 0 10px rgba(192, 83, 42, 0.3), inset 0 0 10px rgba(192, 83, 42, 0.1);
        }

        .difficulty-btn.hard:hover {
            background: rgba(192, 83, 42, 0.15);
            box-shadow: 0 0 20px rgba(192, 83, 42, 0.6), inset 0 0 15px rgba(192, 83, 42, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(192, 83, 42, 0.8);
        }

        .difficulty-btn:active {
            transform: scale(0.97);
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #8b5e3c;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .game-over-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .btn-secondary {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: bold;
            color: #d4a55a;
            background: transparent;
            border: 1px solid #8b5e3c;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(139, 94, 60, 0.2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-secondary:hover {
            color: #f0e0c8;
            border-color: #cc7722;
            background: rgba(139, 94, 60, 0.15);
            box-shadow: 0 0 15px rgba(139, 94, 60, 0.4);
            transform: scale(1.05);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #8b5e3c;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        #slangPopup {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            color: #f0e0c8;
            text-shadow: 0 0 8px rgba(204, 119, 34, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">AUSSIE SERPENT</div>
            <div class="header-right">
                <span class="difficulty-label hidden" id="difficultyLabel"></span>
                <div class="score-display">Tucker: <span id="score">0</span></div>
                <div class="high-score-display">Best: <span id="highScore">0</span></div>
            </div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="difficultyScreen">
                <h2>AUSSIE SERPENT</h2>
                <div class="overlay-subtitle">Choose Yer Challenge, Mate</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn easy" id="easyBtn" data-difficulty="easy">
                        <div class="diff-info">
                            <span class="diff-name">Easy</span>
                            <span class="diff-desc">Slow as a sleepy koala, 1× score</span>
                        </div>
                        <span class="diff-key">[ 1 ]</span>
                    </button>
                    <button class="difficulty-btn medium" id="mediumBtn" data-difficulty="medium">
                        <div class="diff-info">
                            <span class="diff-name">Medium</span>
                            <span class="diff-desc">Steady as a croc, 2× score</span>
                        </div>
                        <span class="diff-key">[ 2 ]</span>
                    </button>
                    <button class="difficulty-btn hard" id="hardBtn" data-difficulty="hard">
                        <div class="diff-info">
                            <span class="diff-name">Hard</span>
                            <span class="diff-desc">Fast as a brown snake, 3× score</span>
                        </div>
                        <span class="diff-key">[ 3 ]</span>
                    </button>
                </div>
                <div class="instructions">Press 1, 2, or 3 to select</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>CRIKEY!</h2>
                <p class="final-score">Tucker Scored: <span id="finalScore">0</span></p>
                <p>Best: <span id="finalHighScore">0</span></p>
                <p id="gameOverSlang"></p>
                <div class="game-over-buttons">
                    <button class="btn" id="restartBtn">Have Another Go</button>
                    <button class="btn-secondary" id="changeDifficultyBtn">Change Yer Challenge</button>
                </div>
                <div class="instructions">Press Enter to have another go or Esc to change challenge</div>
            </div>
            <div id="slangPopup"></div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

            // Colour constants — outback palette
            const BG_DARK = '#2b1a0e';
            const BG_MID = '#4a2e14';
            const SAND = '#d4a55a';
            const DUST_RED = '#c0532a';
            const OCHRE = '#cc7722';
            const SKY_BLUE = '#6fb8d4';
            const SNAKE_BROWN = '#5c3d1e';
            const SNAKE_TAN = '#a67c4a';
            const SNAKE_OLIVE = '#6b6632';
            const DANGER_RED = '#d32f2f';
            const TEXT_LIGHT = '#f0e0c8';

            // Obstacle constants (stubs for FEAT-002)
            const MAX_OBSTACLES = 4;
            const OBSTACLE_SCORE_THRESHOLD = 3;

            // Food types
            const FOOD_TYPES = ['pie', 'vegemite', 'timtam', 'lamington'];

            // Slang phrases
            const SLANG_PHRASES = ["G'day mate!", "Bonzer!", "Strewth!", "Ripper!", "Too easy, legend!", "Fair dinkum!", "Noice one!", "Bewdy!"];

            // Difficulty settings
            const DIFFICULTY_SETTINGS = {
                easy:   { speed: 150, multiplier: 1, label: 'Easy',   color: '#7cb342', cssClass: 'easy' },
                medium: { speed: 120, multiplier: 2, label: 'Medium', color: '#cc7722', cssClass: 'medium' },
                hard:   { speed: 80,  multiplier: 3, label: 'Hard',   color: '#c0532a', cssClass: 'hard' }
            };

            // Current difficulty state
            let currentDifficulty = null;
            let gameSpeed = 120;
            let scoreMultiplier = 1;

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let rawScore = 0;
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;
            let difficultySelected = false;

            // Visual state
            let particles = [];
            let foodPulse = 0;
            let animationFrame = null;
            let foodTypeIndex = 0;

            // Obstacle state (stub for FEAT-002)
            let obstacles = [];

            // High score (loaded from localStorage if available)
            let highScore = 0;
            try {
                highScore = parseInt(localStorage.getItem('aussieSnakeHighScore')) || 0;
            } catch (e) {
                // localStorage unavailable — use in-memory only
            }

            // Slang popup state (stub for FEAT-001)
            let slangTimeoutId = null;

            // Outback background details
            let outbackDetails = [];

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const difficultyScreen = document.getElementById('difficultyScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const difficultyLabel = document.getElementById('difficultyLabel');
            const easyBtn = document.getElementById('easyBtn');
            const mediumBtn = document.getElementById('mediumBtn');
            const hardBtn = document.getElementById('hardBtn');
            const restartBtn = document.getElementById('restartBtn');
            const changeDifficultyBtn = document.getElementById('changeDifficultyBtn');
            const highScoreDisplay = document.getElementById('highScore');
            const finalHighScoreDisplay = document.getElementById('finalHighScore');
            const gameOverSlang = document.getElementById('gameOverSlang');
            const slangPopup = document.getElementById('slangPopup');

            // Generate outback background dot-art details
            function generateOutbackDetails() {
                outbackDetails = [];
                var DOT_COLORS = ['#cc7722', '#d4a55a', '#8b5e3c'];
                var count = 40 + Math.floor(Math.random() * 21);
                for (var i = 0; i < count; i++) {
                    outbackDetails.push({
                        x: Math.random() * CANVAS_SIZE,
                        y: Math.random() * CANVAS_SIZE,
                        size: Math.random() * 3 + 1,
                        color: DOT_COLORS[Math.floor(Math.random() * DOT_COLORS.length)],
                        alpha: Math.random() * 0.3 + 0.1
                    });
                }
            }

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                rawScore = 0;
                scoreDisplay.textContent = '0';
                particles = [];
                obstacles = [];
                foodPulse = 0;
                if (slangTimeoutId) {
                    clearTimeout(slangTimeoutId);
                    slangTimeoutId = null;
                }
                slangPopup.style.opacity = '0';
                generateOutbackDetails();
                spawnFood();
            }

            // Spawn food at random position not occupied by snake or obstacles
            function spawnFood() {
                var newFood;
                var attempts = 0;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                    attempts++;
                    if (attempts > 100) break;
                } while (
                    snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }) ||
                    obstacles.some(function(obs) { return obs.x === newFood.x && obs.y === newFood.y; })
                );
                food = newFood;
                foodTypeIndex = Math.floor(Math.random() * FOOD_TYPES.length);
                foodPulse = 0;
            }

            // Create particle burst when food is collected
            function createFoodParticles(x, y) {
                var colors = ['#cc7722', '#d4a55a', '#c0532a', '#8b5e3c', '#f0e0c8'];
                for (var i = 0; i < 12; i++) {
                    var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                    var speed = Math.random() * 3 + 1.5;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: Math.random() * 0.03 + 0.02,
                        size: Math.random() * 3 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            // Update particles
            function updateParticles() {
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life -= particles[i].decay;
                    particles[i].vx *= 0.96;
                    particles[i].vy *= 0.96;
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            // Show slang popup near the food that was eaten
            function showSlangPopup(pixelX, pixelY) {
                var phrase = SLANG_PHRASES[Math.floor(Math.random() * SLANG_PHRASES.length)];
                slangPopup.textContent = phrase;
                slangPopup.style.left = Math.max(0, Math.min(pixelX - 60, CANVAS_SIZE - 120)) + 'px';
                slangPopup.style.top = (pixelY - 30) + 'px';
                slangPopup.style.opacity = '1';
                if (slangTimeoutId) {
                    clearTimeout(slangTimeoutId);
                }
                slangTimeoutId = setTimeout(function() {
                    slangPopup.style.opacity = '0';
                }, 1000);
            }

            // Maybe spawn an obstacle after food is eaten
            function maybeSpawnObstacle() {
                if (rawScore < OBSTACLE_SCORE_THRESHOLD) return;
                if (obstacles.length >= MAX_OBSTACLES) return;

                var desiredCount = Math.min(MAX_OBSTACLES, Math.floor((rawScore - OBSTACLE_SCORE_THRESHOLD) / 3) + 1);
                if (obstacles.length >= desiredCount) return;

                var type = Math.random() < 0.5 ? 'kangaroo' : 'spider';
                var pos = null;
                for (var attempt = 0; attempt < 50; attempt++) {
                    var cx = Math.floor(Math.random() * GRID_SIZE);
                    var cy = Math.floor(Math.random() * GRID_SIZE);
                    // Must not overlap snake
                    if (snake.some(function(seg) { return seg.x === cx && seg.y === cy; })) continue;
                    // Must not overlap food
                    if (food.x === cx && food.y === cy) continue;
                    // Must not overlap existing obstacles
                    if (obstacles.some(function(obs) { return obs.x === cx && obs.y === cy; })) continue;
                    // Manhattan distance from snake head >= 2
                    if (Math.abs(snake[0].x - cx) + Math.abs(snake[0].y - cy) < 2) continue;
                    pos = { x: cx, y: cy };
                    break;
                }
                if (pos) {
                    obstacles.push({ x: pos.x, y: pos.y, type: type });
                }
            }

            // Draw obstacles: kangaroo silhouettes and redback spiders
            function drawObstacles() {
                var pulse = Math.sin(Date.now() * 0.005) * 0.2;
                for (var i = 0; i < obstacles.length; i++) {
                    var obs = obstacles[i];
                    var ox = obs.x * CELL_SIZE + CELL_SIZE / 2;
                    var oy = obs.y * CELL_SIZE + CELL_SIZE / 2;

                    ctx.save();
                    ctx.shadowColor = 'rgba(211, 47, 47, ' + (0.3 + pulse) + ')';
                    ctx.shadowBlur = 4;

                    if (obs.type === 'kangaroo') {
                        // Kangaroo side-profile silhouette in warm brown
                        ctx.fillStyle = '#8d6e4c';
                        ctx.strokeStyle = '#8d6e4c';
                        ctx.lineWidth = 1;

                        ctx.translate(ox, oy);
                        var s = CELL_SIZE / 20; // scale factor

                        ctx.beginPath();
                        // Body — oval
                        ctx.ellipse(0, 1 * s, 6 * s, 4 * s, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // Head — small circle
                        ctx.beginPath();
                        ctx.arc(-5 * s, -5 * s, 3 * s, 0, Math.PI * 2);
                        ctx.fill();

                        // Left ear — triangle
                        ctx.beginPath();
                        ctx.moveTo(-6.5 * s, -7 * s);
                        ctx.lineTo(-7.5 * s, -10 * s);
                        ctx.lineTo(-5 * s, -7.5 * s);
                        ctx.closePath();
                        ctx.fill();

                        // Right ear — triangle
                        ctx.beginPath();
                        ctx.moveTo(-4 * s, -7.5 * s);
                        ctx.lineTo(-3.5 * s, -10 * s);
                        ctx.lineTo(-2.5 * s, -7 * s);
                        ctx.closePath();
                        ctx.fill();

                        // Tail — curved thick line
                        ctx.lineWidth = 2 * s;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(6 * s, 0);
                        ctx.quadraticCurveTo(9 * s, -3 * s, 8 * s, -6 * s);
                        ctx.stroke();

                        // Back left leg
                        ctx.lineWidth = 2.5 * s;
                        ctx.beginPath();
                        ctx.moveTo(2 * s, 4 * s);
                        ctx.lineTo(3 * s, 8 * s);
                        ctx.lineTo(5 * s, 9 * s);
                        ctx.stroke();

                        // Back right leg
                        ctx.beginPath();
                        ctx.moveTo(0, 4 * s);
                        ctx.lineTo(1 * s, 8 * s);
                        ctx.lineTo(3 * s, 9 * s);
                        ctx.stroke();

                        // Front arm (small)
                        ctx.lineWidth = 1.5 * s;
                        ctx.beginPath();
                        ctx.moveTo(-3 * s, -1 * s);
                        ctx.lineTo(-4 * s, 2 * s);
                        ctx.stroke();

                    } else {
                        // Redback spider
                        ctx.translate(ox, oy);
                        var ss = CELL_SIZE / 20;

                        // Body — black circle
                        ctx.fillStyle = '#1a1a1a';
                        ctx.beginPath();
                        ctx.arc(0, 0, 4 * ss, 0, Math.PI * 2);
                        ctx.fill();

                        // Red hourglass / stripe on back
                        ctx.fillStyle = '#d32f2f';
                        ctx.beginPath();
                        ctx.moveTo(-1.5 * ss, -3 * ss);
                        ctx.lineTo(0, -1 * ss);
                        ctx.lineTo(1.5 * ss, -3 * ss);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(-1.5 * ss, 3 * ss);
                        ctx.lineTo(0, 1 * ss);
                        ctx.lineTo(1.5 * ss, 3 * ss);
                        ctx.closePath();
                        ctx.fill();

                        // 8 legs with quadratic bezier curves
                        ctx.strokeStyle = '#1a1a1a';
                        ctx.lineWidth = 1;
                        ctx.lineCap = 'round';
                        var legAngles = [-0.8, -0.4, 0.4, 0.8];
                        // Right side legs
                        for (var la = 0; la < legAngles.length; la++) {
                            var baseAngle = legAngles[la];
                            var startX = Math.cos(baseAngle) * 3 * ss;
                            var startY = Math.sin(baseAngle) * 3 * ss;
                            var cpX = Math.cos(baseAngle) * 8 * ss + (la % 2 === 0 ? 2 * ss : -2 * ss);
                            var cpY = Math.sin(baseAngle) * 8 * ss;
                            var endX = Math.cos(baseAngle) * 9 * ss;
                            var endY = Math.sin(baseAngle) * 9 * ss;
                            ctx.beginPath();
                            ctx.moveTo(startX, startY);
                            ctx.quadraticCurveTo(cpX, cpY, endX, endY);
                            ctx.stroke();
                        }
                        // Left side legs (mirror)
                        for (var lb = 0; lb < legAngles.length; lb++) {
                            var baseAngle2 = Math.PI - legAngles[lb];
                            var startX2 = Math.cos(baseAngle2) * 3 * ss;
                            var startY2 = Math.sin(baseAngle2) * 3 * ss;
                            var cpX2 = Math.cos(baseAngle2) * 8 * ss + (lb % 2 === 0 ? -2 * ss : 2 * ss);
                            var cpY2 = Math.sin(baseAngle2) * 8 * ss;
                            var endX2 = Math.cos(baseAngle2) * 9 * ss;
                            var endY2 = Math.sin(baseAngle2) * 9 * ss;
                            ctx.beginPath();
                            ctx.moveTo(startX2, startY2);
                            ctx.quadraticCurveTo(cpX2, cpY2, endX2, endY2);
                            ctx.stroke();
                        }
                    }

                    ctx.restore();
                }
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Check obstacle collision
                if (obstacles.some(function(obs) { return obs.x === head.x && obs.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    rawScore++;
                    score = rawScore * scoreMultiplier;
                    scoreDisplay.textContent = score;
                    // Create particle burst at food position
                    createFoodParticles(
                        food.x * CELL_SIZE + CELL_SIZE / 2,
                        food.y * CELL_SIZE + CELL_SIZE / 2
                    );
                    // Slang popup (stub)
                    showSlangPopup(
                        food.x * CELL_SIZE + CELL_SIZE / 2,
                        food.y * CELL_SIZE + CELL_SIZE / 2
                    );
                    // Maybe spawn obstacle (stub)
                    maybeSpawnObstacle();
                    // Live high score update
                    if (score > highScore) {
                        highScore = score;
                        highScoreDisplay.textContent = highScore;
                    }
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Draw outback background
            function drawOutbackBackground() {
                // Sky-to-ground gradient
                var skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
                skyGrad.addColorStop(0, SKY_BLUE);
                skyGrad.addColorStop(0.3, SAND);
                skyGrad.addColorStop(0.55, DUST_RED);
                skyGrad.addColorStop(1, BG_MID);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Dot-art texture
                for (var i = 0; i < outbackDetails.length; i++) {
                    var dot = outbackDetails[i];
                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
                    ctx.fillStyle = dot.color;
                    ctx.globalAlpha = dot.alpha;
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Subtle grid
                ctx.strokeStyle = 'rgba(180, 140, 90, 0.12)';
                ctx.lineWidth = 0.3;
                for (var g = 0; g <= GRID_SIZE; g++) {
                    ctx.beginPath();
                    ctx.moveTo(g * CELL_SIZE, 0);
                    ctx.lineTo(g * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, g * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, g * CELL_SIZE);
                    ctx.stroke();
                }
            }

            // Draw food as Australian items
            function drawFood() {
                var fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                var fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                foodPulse += 0.08;
                var pulse = Math.sin(foodPulse) * 0.15 + 0.85;

                ctx.save();
                ctx.shadowColor = OCHRE;
                ctx.shadowBlur = 6 * pulse;

                if (foodTypeIndex === 0) {
                    // Meat pie — golden circle with darker filling and bite
                    var pieR = (CELL_SIZE / 2 - 2) * pulse;
                    // Pie crust
                    ctx.fillStyle = '#d4a55a';
                    ctx.beginPath();
                    ctx.arc(fx, fy, pieR, 0, Math.PI * 2);
                    ctx.fill();
                    // Filling
                    ctx.fillStyle = '#8b5e3c';
                    ctx.beginPath();
                    ctx.arc(fx, fy, pieR * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    // Bite arc (cut out a wedge)
                    ctx.fillStyle = '#4a2e14';
                    ctx.beginPath();
                    ctx.moveTo(fx + pieR * 0.3, fy - pieR * 0.3);
                    ctx.arc(fx + pieR * 0.5, fy - pieR * 0.5, pieR * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    // Steam lines
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(240, 224, 200, 0.5)';
                    ctx.lineWidth = 1;
                    var steamOffset = Math.sin(foodPulse * 2) * 2;
                    ctx.beginPath();
                    ctx.moveTo(fx - 2, fy - pieR - 1);
                    ctx.quadraticCurveTo(fx - 2 + steamOffset, fy - pieR - 4, fx - 2, fy - pieR - 7);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(fx + 2, fy - pieR - 1);
                    ctx.quadraticCurveTo(fx + 2 - steamOffset, fy - pieR - 5, fx + 2, fy - pieR - 9);
                    ctx.stroke();
                } else if (foodTypeIndex === 1) {
                    // Vegemite on toast — light brown rect + dark brown rect
                    var toastW = (CELL_SIZE - 4) * pulse;
                    var toastH = (CELL_SIZE - 6) * pulse;
                    var toastX = fx - toastW / 2;
                    var toastY = fy - toastH / 2;
                    // Toast base
                    ctx.fillStyle = '#c8a86e';
                    ctx.beginPath();
                    ctx.roundRect(toastX, toastY, toastW, toastH, 2);
                    ctx.fill();
                    // Vegemite spread
                    var vPad = 2;
                    ctx.fillStyle = '#3e2723';
                    ctx.beginPath();
                    ctx.roundRect(toastX + vPad, toastY + vPad, toastW - vPad * 2, toastH - vPad * 2, 1);
                    ctx.fill();
                } else if (foodTypeIndex === 2) {
                    // Tim Tam — dark brown rectangle with cream line + gloss
                    var ttW = (CELL_SIZE - 4) * pulse;
                    var ttH = (CELL_SIZE - 8) * pulse;
                    var ttX = fx - ttW / 2;
                    var ttY = fy - ttH / 2;
                    // Body
                    ctx.fillStyle = '#4e2a1a';
                    ctx.beginPath();
                    ctx.roundRect(ttX, ttY, ttW, ttH, 2);
                    ctx.fill();
                    // Cream line
                    ctx.fillStyle = '#d4a55a';
                    ctx.fillRect(ttX + 1, fy - 1, ttW - 2, 2);
                    // Gloss highlight
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.fillRect(ttX + 1, ttY + 1, ttW - 2, ttH * 0.3);
                } else {
                    // Lamington — brown square with white coconut dots
                    var lamS = (CELL_SIZE - 6) * pulse;
                    var lamX = fx - lamS / 2;
                    var lamY = fy - lamS / 2;
                    // Chocolate body
                    ctx.fillStyle = '#5c3320';
                    ctx.beginPath();
                    ctx.roundRect(lamX, lamY, lamS, lamS, 2);
                    ctx.fill();
                    // Coconut dots
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    var dotPositions = [
                        [-0.3, -0.4], [0.3, -0.4], [-0.4, 0], [0.4, 0],
                        [-0.3, 0.4], [0.3, 0.4], [0, -0.4], [0, 0.4]
                    ];
                    for (var d = 0; d < dotPositions.length; d++) {
                        ctx.beginPath();
                        ctx.arc(fx + dotPositions[d][0] * lamS, fy + dotPositions[d][1] * lamS, 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            // Draw snake head as triangular brown serpent head
            function drawSnakeHead(segment) {
                var cx = segment.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = segment.y * CELL_SIZE + CELL_SIZE / 2;
                var size = CELL_SIZE / 2 - 1;

                ctx.save();

                // Translate and rotate based on direction
                ctx.translate(cx, cy);
                var angle = 0;
                if (direction.x === 1) angle = 0;
                else if (direction.x === -1) angle = Math.PI;
                else if (direction.y === -1) angle = -Math.PI / 2;
                else if (direction.y === 1) angle = Math.PI / 2;
                ctx.rotate(angle);

                // Triangular head pointing right
                ctx.beginPath();
                ctx.moveTo(size, 0);
                ctx.lineTo(-size * 0.6, -size * 0.7);
                ctx.lineTo(-size * 0.6, size * 0.7);
                ctx.closePath();
                ctx.fillStyle = SNAKE_BROWN;
                ctx.fill();
                ctx.strokeStyle = '#7a5530';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Eyes — two white circles with dark pupils
                var eyeOffsetX = size * 0.05;
                var eyeOffsetY = size * 0.35;
                var eyeR = size * 0.18;
                var pupilR = size * 0.09;

                // Left eye (top in local coords)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(eyeOffsetX, -eyeOffsetY, eyeR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(eyeOffsetX + pupilR * 0.3, -eyeOffsetY, pupilR, 0, Math.PI * 2);
                ctx.fill();

                // Right eye (bottom in local coords)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(eyeOffsetX, eyeOffsetY, eyeR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(eyeOffsetX + pupilR * 0.3, eyeOffsetY, pupilR, 0, Math.PI * 2);
                ctx.fill();

                // Forked tongue — flickering
                if (Date.now() % 400 < 200) {
                    ctx.strokeStyle = '#cc3333';
                    ctx.lineWidth = 1;
                    // Main tongue
                    ctx.beginPath();
                    ctx.moveTo(size, 0);
                    ctx.lineTo(size + 5, 0);
                    ctx.stroke();
                    // Fork top
                    ctx.beginPath();
                    ctx.moveTo(size + 5, 0);
                    ctx.lineTo(size + 8, -2);
                    ctx.stroke();
                    // Fork bottom
                    ctx.beginPath();
                    ctx.moveTo(size + 5, 0);
                    ctx.lineTo(size + 8, 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Draw snake body as rounded rectangles with banding
            function drawSnakeBody() {
                for (var index = 1; index < snake.length; index++) {
                    var segment = snake[index];
                    var x = segment.x * CELL_SIZE + 1;
                    var y = segment.y * CELL_SIZE + 1;
                    var w = CELL_SIZE - 2;
                    var h = CELL_SIZE - 2;
                    var progress = index / snake.length;

                    // Interpolate from SNAKE_TAN (near head) to lighter tan (near tail)
                    var r = Math.floor(166 + progress * 40);  // 166 → 206
                    var g = Math.floor(124 + progress * 50);  // 124 → 174
                    var b = Math.floor(74 + progress * 50);   // 74 → 124
                    var alpha = 1.0 - progress * 0.4;         // 1.0 → 0.6

                    ctx.save();
                    ctx.globalAlpha = alpha;

                    // Rounded rectangle body segment
                    ctx.fillStyle = 'rgb(' + r + ', ' + g + ', ' + b + ')';
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, 4);
                    ctx.fill();

                    // Centre stripe (Eastern Brown Snake banding)
                    ctx.strokeStyle = SNAKE_OLIVE;
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = alpha * 0.6;
                    ctx.beginPath();
                    ctx.moveTo(x, y + h / 2);
                    ctx.lineTo(x + w, y + h / 2);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // Draw particles
            function drawParticles() {
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Draw everything
            function draw() {
                drawOutbackBackground();
                drawParticles();
                drawObstacles();
                drawFood();
                drawSnakeBody();
                if (snake.length > 0) {
                    drawSnakeHead(snake[0]);
                }
            }

            // Animation loop (renamed from animateBackground)
            function animate() {
                updateParticles();
                if (!gameRunning) {
                    draw();
                }
                animationFrame = requestAnimationFrame(animate);
            }

            // Select difficulty and start the game
            function selectDifficulty(level) {
                var settings = DIFFICULTY_SETTINGS[level];
                if (!settings) return;

                currentDifficulty = level;
                gameSpeed = settings.speed;
                scoreMultiplier = settings.multiplier;
                difficultySelected = true;

                // Update the difficulty label in the header
                difficultyLabel.textContent = settings.label;
                difficultyLabel.className = 'difficulty-label ' + settings.cssClass;

                // Hide difficulty screen and start the game
                difficultyScreen.classList.add('hidden');
                startGame();
            }

            // Show the difficulty selection screen
            function showDifficultyScreen() {
                gameStarted = false;
                difficultySelected = false;
                gameOverScreen.classList.add('hidden');
                difficultyScreen.classList.remove('hidden');
                difficultyLabel.classList.add('hidden');
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                // Update high score and persist to localStorage
                if (score > highScore) {
                    highScore = score;
                    highScoreDisplay.textContent = highScore;
                    try {
                        localStorage.setItem('aussieSnakeHighScore', highScore.toString());
                    } catch (e) {
                        // localStorage unavailable — keep in-memory only
                    }
                }
                finalScoreDisplay.textContent = score;
                finalHighScoreDisplay.textContent = highScore;
                // Set slang commentary based on score
                if (score >= 50) {
                    gameOverSlang.textContent = 'Fair dinkum legend!';
                } else if (score >= 20) {
                    gameOverSlang.textContent = 'Ripper!';
                } else if (score >= 10) {
                    gameOverSlang.textContent = 'Not bad, mate!';
                } else {
                    gameOverSlang.textContent = 'Give it another go!';
                }
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                initGame();
                gameRunning = true;
                gameStarted = true;
                difficultyScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                draw();
                gameLoop = setInterval(function() {
                    update();
                    if (gameRunning) {
                        draw();
                    }
                }, gameSpeed);
            }

            // Restart game at same difficulty
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Difficulty selection keys (1, 2, 3) when on difficulty screen
                if (!difficultySelected && !gameStarted) {
                    if (e.key === '1') {
                        selectDifficulty('easy');
                        e.preventDefault();
                        return;
                    } else if (e.key === '2') {
                        selectDifficulty('medium');
                        e.preventDefault();
                        return;
                    } else if (e.key === '3') {
                        selectDifficulty('hard');
                        e.preventDefault();
                        return;
                    }
                }

                // Arrow keys should only work after difficulty is selected
                if (difficultySelected && !gameRunning && !gameStarted) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        startGame();
                        if (e.key === 'ArrowUp' && direction.y !== 1) {
                            nextDirection = { x: 0, y: -1 };
                        } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                            nextDirection = { x: 0, y: 1 };
                        } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                            nextDirection = { x: -1, y: 0 };
                        } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                            nextDirection = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        return;
                    }
                }

                // Restart on Enter when game over, Escape to change difficulty
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }
                if (!gameRunning && gameStarted && e.key === 'Escape') {
                    showDifficultyScreen();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers - Difficulty selection
            easyBtn.addEventListener('click', function() { selectDifficulty('easy'); });
            mediumBtn.addEventListener('click', function() { selectDifficulty('medium'); });
            hardBtn.addEventListener('click', function() { selectDifficulty('hard'); });

            // Button handlers - Game over
            restartBtn.addEventListener('click', restartGame);
            changeDifficultyBtn.addEventListener('click', showDifficultyScreen);

            // Start background animation
            highScoreDisplay.textContent = highScore;
            animate();

            // Draw initial state
            draw();
        })();
    </script>
</body>
</html>
