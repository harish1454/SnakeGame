<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1A0E0A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #E8DCC8;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #E8720C;
            text-shadow: 0 0 10px rgba(232, 114, 12, 0.5), 0 0 20px rgba(232, 114, 12, 0.3);
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .difficulty-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid;
        }

        .difficulty-label.hidden {
            display: none;
        }

        .difficulty-label.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            text-shadow: 0 0 6px rgba(105, 240, 174, 0.5);
        }

        .difficulty-label.medium {
            color: #ffab40;
            border-color: #ffab40;
            text-shadow: 0 0 6px rgba(255, 171, 64, 0.5);
        }

        .difficulty-label.hard {
            color: #ff5252;
            border-color: #ff5252;
            text-shadow: 0 0 6px rgba(255, 82, 82, 0.5);
        }

        .score-display {
            font-size: 20px;
            color: #F5A623;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(245, 166, 35, 0.4);
        }

        canvas {
            border: 2px solid #5C3A1E;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(232, 114, 12, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse at center, rgba(26, 14, 10, 0.95) 0%, rgba(15, 8, 5, 0.98) 100%);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #E8720C;
            text-shadow: 0 0 15px rgba(232, 114, 12, 0.7), 0 0 30px rgba(232, 114, 12, 0.4);
            letter-spacing: 3px;
        }

        .overlay p {
            font-size: 16px;
            color: #D4C4A8;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #F5A623;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.5);
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #E8720C;
            background: transparent;
            border: 2px solid #E8720C;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(232, 114, 12, 0.3), inset 0 0 10px rgba(232, 114, 12, 0.1);
        }

        .btn:hover {
            background: rgba(232, 114, 12, 0.15);
            box-shadow: 0 0 20px rgba(232, 114, 12, 0.6), inset 0 0 15px rgba(232, 114, 12, 0.2);
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(232, 114, 12, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
        }

        .difficulty-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .difficulty-btn .diff-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .difficulty-btn .diff-name {
            font-size: 16px;
        }

        .difficulty-btn .diff-desc {
            font-size: 11px;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.7;
        }

        .difficulty-btn .diff-key {
            font-size: 12px;
            opacity: 0.5;
            font-weight: normal;
        }

        .difficulty-btn.easy {
            color: #69f0ae;
            border-color: #69f0ae;
            box-shadow: 0 0 10px rgba(105, 240, 174, 0.3), inset 0 0 10px rgba(105, 240, 174, 0.1);
        }

        .difficulty-btn.easy:hover {
            background: rgba(105, 240, 174, 0.15);
            box-shadow: 0 0 20px rgba(105, 240, 174, 0.6), inset 0 0 15px rgba(105, 240, 174, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(105, 240, 174, 0.8);
        }

        .difficulty-btn.medium {
            color: #ffab40;
            border-color: #ffab40;
            box-shadow: 0 0 10px rgba(255, 171, 64, 0.3), inset 0 0 10px rgba(255, 171, 64, 0.1);
        }

        .difficulty-btn.medium:hover {
            background: rgba(255, 171, 64, 0.15);
            box-shadow: 0 0 20px rgba(255, 171, 64, 0.6), inset 0 0 15px rgba(255, 171, 64, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 171, 64, 0.8);
        }

        .difficulty-btn.hard {
            color: #ff5252;
            border-color: #ff5252;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3), inset 0 0 10px rgba(255, 82, 82, 0.1);
        }

        .difficulty-btn.hard:hover {
            background: rgba(255, 82, 82, 0.15);
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.6), inset 0 0 15px rgba(255, 82, 82, 0.2);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 82, 82, 0.8);
        }

        .difficulty-btn:active {
            transform: scale(0.97);
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #8B6B4A;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .game-over-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .btn-secondary {
            padding: 10px 28px;
            font-size: 14px;
            font-weight: bold;
            color: #D4C4A8;
            background: transparent;
            border: 1px solid #6B3A2A;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(107, 58, 42, 0.2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-secondary:hover {
            color: #E8DCC8;
            border-color: #8B5E3C;
            background: rgba(107, 58, 42, 0.15);
            box-shadow: 0 0 15px rgba(107, 58, 42, 0.4);
            transform: scale(1.05);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #8B6B4A;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">SAFARI SNAKE</div>
            <div class="header-right">
                <span class="difficulty-label hidden" id="difficultyLabel"></span>
                <div class="score-display">Gems: <span id="score">0</span></div>
            </div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="difficultyScreen">
                <h2>SAVANNA SERPENT</h2>
                <div class="overlay-subtitle">Choose Your Path</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn easy" id="easyBtn" data-difficulty="easy">
                        <div class="diff-info">
                            <span class="diff-name">Easy</span>
                            <span class="diff-desc">Slow speed, 1x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 1 ]</span>
                    </button>
                    <button class="difficulty-btn medium" id="mediumBtn" data-difficulty="medium">
                        <div class="diff-info">
                            <span class="diff-name">Medium</span>
                            <span class="diff-desc">Normal speed, 2x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 2 ]</span>
                    </button>
                    <button class="difficulty-btn hard" id="hardBtn" data-difficulty="hard">
                        <div class="diff-info">
                            <span class="diff-name">Hard</span>
                            <span class="diff-desc">Fast speed, 3x score multiplier</span>
                        </div>
                        <span class="diff-key">[ 3 ]</span>
                    </button>
                </div>
                <div class="instructions">Press 1, 2, or 3 to select</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>SAFARI OVER</h2>
                <p class="final-score">Gems Collected: <span id="finalScore">0</span></p>
                <div class="game-over-buttons">
                    <button class="btn" id="restartBtn">Play Again</button>
                    <button class="btn-secondary" id="changeDifficultyBtn">Change Difficulty</button>
                </div>
                <div class="instructions">Press Enter to play again or Esc to change difficulty</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

            // Difficulty settings
            const DIFFICULTY_SETTINGS = {
                easy:   { speed: 150, multiplier: 1, label: 'Easy',   color: '#69f0ae', cssClass: 'easy' },
                medium: { speed: 120, multiplier: 2, label: 'Medium', color: '#ffab40', cssClass: 'medium' },
                hard:   { speed: 80,  multiplier: 3, label: 'Hard',   color: '#ff5252', cssClass: 'hard' }
            };

            // Current difficulty state
            let currentDifficulty = null; // 'easy', 'medium', or 'hard'
            let gameSpeed = 120;
            let scoreMultiplier = 1;

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let rawScore = 0; // Score before multiplier
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;
            let difficultySelected = false;

            // Theme state
            let stars = [];
            let particles = [];
            let thrusterParticles = [];
            let foodType = 0; // 0 = mango, 1 = diamond gem, 2 = mouse
            let foodPulse = 0;
            let starfieldOffset = 0;
            let animationFrame = null;

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const difficultyScreen = document.getElementById('difficultyScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const difficultyLabel = document.getElementById('difficultyLabel');
            const easyBtn = document.getElementById('easyBtn');
            const mediumBtn = document.getElementById('mediumBtn');
            const hardBtn = document.getElementById('hardBtn');
            const restartBtn = document.getElementById('restartBtn');
            const changeDifficultyBtn = document.getElementById('changeDifficultyBtn');

            // Generate dust particles (replaces starfield)
            function generateStars() {
                stars = [];
                for (var i = 0; i < 120; i++) {
                    stars.push({
                        x: Math.random() * CANVAS_SIZE,
                        y: Math.random() * CANVAS_SIZE,
                        size: Math.random() * 2 + 0.5,
                        brightness: Math.random(),
                        twinkleSpeed: Math.random() * 0.03 + 0.01,
                        twinkleOffset: Math.random() * Math.PI * 2
                    });
                }
            }

            // Initialize dust particles
            generateStars();

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                rawScore = 0;
                scoreDisplay.textContent = '0';
                particles = [];
                thrusterParticles = [];
                spawnFood();
            }

            // Spawn food at random position not occupied by snake
            function spawnFood() {
                var newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }));
                food = newFood;
                foodType = Math.floor(Math.random() * 3); // cycle through types
            }

            // Create particle burst when food is collected
            function createFoodParticles(x, y) {
                var colors = ['#E8720C', '#F5A623', '#B7410E', '#FFD93D', '#4A7C2E'];
                for (var i = 0; i < 12; i++) {
                    var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                    var speed = Math.random() * 3 + 1.5;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: Math.random() * 0.03 + 0.02,
                        size: Math.random() * 3 + 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            // Create thruster particles behind the snake head
            function createThrusterParticle() {
                if (!gameRunning || snake.length === 0) return;
                var head = snake[0];
                var cx = head.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = head.y * CELL_SIZE + CELL_SIZE / 2;
                // Place particles behind the direction of travel
                var offsetX = -direction.x * CELL_SIZE * 0.4;
                var offsetY = -direction.y * CELL_SIZE * 0.4;
                for (var i = 0; i < 2; i++) {
                    thrusterParticles.push({
                        x: cx + offsetX + (Math.random() - 0.5) * 6,
                        y: cy + offsetY + (Math.random() - 0.5) * 6,
                        vx: -direction.x * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        vy: -direction.y * (Math.random() * 1.5 + 0.5) + (Math.random() - 0.5) * 0.8,
                        life: 1.0,
                        decay: Math.random() * 0.05 + 0.04,
                        size: Math.random() * 2.5 + 1
                    });
                }
            }

            // Update particles
            function updateParticles() {
                // Food particles
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life -= particles[i].decay;
                    particles[i].vx *= 0.96;
                    particles[i].vy *= 0.96;
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                // Thruster particles
                for (var j = thrusterParticles.length - 1; j >= 0; j--) {
                    thrusterParticles[j].x += thrusterParticles[j].vx;
                    thrusterParticles[j].y += thrusterParticles[j].vy;
                    thrusterParticles[j].life -= thrusterParticles[j].decay;
                    if (thrusterParticles[j].life <= 0) {
                        thrusterParticles.splice(j, 1);
                    }
                }
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Create thruster particles
                createThrusterParticle();

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    rawScore++;
                    score = rawScore * scoreMultiplier;
                    scoreDisplay.textContent = score;
                    // Create particle burst at food position
                    createFoodParticles(
                        food.x * CELL_SIZE + CELL_SIZE / 2,
                        food.y * CELL_SIZE + CELL_SIZE / 2
                    );
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Helper: Draw an acacia tree silhouette
            function drawAcaciaTree(x, groundY, trunkHeight, canopyWidth) {
                ctx.fillStyle = '#1A0E0A';
                // Trunk
                ctx.fillRect(x - 2, groundY - trunkHeight, 4, trunkHeight);
                // Canopy (flat-topped ellipse)
                ctx.beginPath();
                ctx.ellipse(x, groundY - trunkHeight, canopyWidth / 2, canopyWidth / 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Helper: Draw an elephant silhouette
            function drawElephantSilhouette(x, groundY, scale) {
                ctx.fillStyle = '#1A0E0A';
                var s = scale;
                ctx.beginPath();
                // Body (large ellipse)
                ctx.ellipse(x, groundY - 8 * s, 12 * s, 8 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                // Head (smaller circle forward and up)
                ctx.beginPath();
                ctx.ellipse(x + 10 * s, groundY - 12 * s, 6 * s, 6 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                // Trunk (curved line hanging down from head)
                ctx.beginPath();
                ctx.moveTo(x + 15 * s, groundY - 10 * s);
                ctx.quadraticCurveTo(x + 20 * s, groundY - 4 * s, x + 17 * s, groundY - 2 * s);
                ctx.lineWidth = 2 * s;
                ctx.strokeStyle = '#1A0E0A';
                ctx.stroke();
                // Legs (4 short rectangles)
                ctx.fillRect(x - 8 * s, groundY - 2 * s, 3 * s, 4 * s);
                ctx.fillRect(x - 3 * s, groundY - 2 * s, 3 * s, 4 * s);
                ctx.fillRect(x + 4 * s, groundY - 2 * s, 3 * s, 4 * s);
                ctx.fillRect(x + 9 * s, groundY - 2 * s, 3 * s, 4 * s);
            }

            // Helper: Draw a giraffe silhouette
            function drawGiraffeSilhouette(x, groundY, scale) {
                ctx.fillStyle = '#1A0E0A';
                var s = scale;
                // Body (horizontal ellipse)
                ctx.beginPath();
                ctx.ellipse(x, groundY - 8 * s, 10 * s, 5 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                // Neck (tall narrow rectangle going up from front of body)
                ctx.fillRect(x + 6 * s, groundY - 28 * s, 4 * s, 20 * s);
                // Head (small ellipse at top of neck)
                ctx.beginPath();
                ctx.ellipse(x + 8 * s, groundY - 30 * s, 4 * s, 3 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                // Legs (4 thin rectangles)
                ctx.fillRect(x - 7 * s, groundY - 4 * s, 2 * s, 6 * s);
                ctx.fillRect(x - 3 * s, groundY - 4 * s, 2 * s, 6 * s);
                ctx.fillRect(x + 3 * s, groundY - 4 * s, 2 * s, 6 * s);
                ctx.fillRect(x + 7 * s, groundY - 4 * s, 2 * s, 6 * s);
            }

            // Draw savanna background
            function drawStarfield() {
                // Sky gradient (sunset)
                var skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
                skyGrad.addColorStop(0.0, '#1A0533');
                skyGrad.addColorStop(0.25, '#B7410E');
                skyGrad.addColorStop(0.5, '#E8720C');
                skyGrad.addColorStop(0.7, '#F5A623');
                skyGrad.addColorStop(0.85, '#FFD93D');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Sun disc
                var sunGrad = ctx.createRadialGradient(300, 270, 0, 300, 270, 35);
                sunGrad.addColorStop(0, '#FFFFFF');
                sunGrad.addColorStop(0.5, '#FFD93D');
                sunGrad.addColorStop(1, 'rgba(232, 114, 12, 0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(300, 270, 35, 0, Math.PI * 2);
                ctx.fill();

                // Back hill layer (distant mountains)
                ctx.fillStyle = '#3D1F0E';
                ctx.beginPath();
                ctx.moveTo(0, 310);
                ctx.quadraticCurveTo(60, 260, 120, 290);
                ctx.quadraticCurveTo(180, 250, 240, 280);
                ctx.quadraticCurveTo(310, 255, 360, 270);
                ctx.quadraticCurveTo(390, 285, 400, 310);
                ctx.lineTo(400, 310);
                ctx.closePath();
                ctx.fill();

                // Front hill layer (closer mountains)
                ctx.fillStyle = '#5C3A1E';
                ctx.beginPath();
                ctx.moveTo(0, 325);
                ctx.quadraticCurveTo(50, 290, 100, 305);
                ctx.quadraticCurveTo(160, 280, 210, 300);
                ctx.quadraticCurveTo(270, 285, 330, 295);
                ctx.quadraticCurveTo(370, 300, 400, 325);
                ctx.lineTo(400, 325);
                ctx.closePath();
                ctx.fill();

                // Wildlife silhouettes
                drawElephantSilhouette(80, 333, 0.8);
                drawGiraffeSilhouette(260, 328, 1.0);
                drawElephantSilhouette(350, 336, 0.6);

                // Acacia tree silhouettes
                drawAcaciaTree(50, 335, 30, 40);
                drawAcaciaTree(130, 330, 45, 55);
                drawAcaciaTree(220, 338, 25, 35);
                drawAcaciaTree(310, 325, 55, 65);
                drawAcaciaTree(370, 336, 20, 30);

                // Ground / savanna floor
                var groundGrad = ctx.createLinearGradient(0, 340, 0, 400);
                groundGrad.addColorStop(0, '#5C6B2A');
                groundGrad.addColorStop(1, '#3D4A1A');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, 340, CANVAS_SIZE, 60);

                // Ground texture lines
                ctx.strokeStyle = 'rgba(90, 80, 40, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 355);
                ctx.quadraticCurveTo(100, 353, 200, 356);
                ctx.quadraticCurveTo(300, 354, 400, 357);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, 370);
                ctx.quadraticCurveTo(80, 368, 180, 371);
                ctx.quadraticCurveTo(280, 369, 400, 372);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, 385);
                ctx.quadraticCurveTo(120, 383, 250, 386);
                ctx.quadraticCurveTo(350, 384, 400, 387);
                ctx.stroke();

                // Ambient dust particles (replaces stars)
                var time = Date.now() * 0.001;
                for (var i = 0; i < stars.length; i++) {
                    var star = stars[i];
                    var twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.5 + 0.5;
                    var alpha = star.brightness * 0.4 + twinkle * 0.6;
                    // Scroll effect - slight vertical drift
                    var yPos = (star.y + starfieldOffset * star.size * 0.3) % CANVAS_SIZE;
                    if (yPos < 0) yPos += CANVAS_SIZE;

                    ctx.beginPath();
                    ctx.arc(star.x, yPos, star.size * (0.5 + twinkle * 0.5), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(210, 180, 120, ' + alpha + ')';
                    ctx.fill();

                    // Add glow to brighter particles
                    if (star.size > 1.5) {
                        ctx.beginPath();
                        ctx.arc(star.x, yPos, star.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(200, 160, 80, ' + (alpha * 0.2) + ')';
                        ctx.fill();
                    }
                }

                // Warm grid overlay
                ctx.strokeStyle = 'rgba(80, 60, 30, 0.1)';
                ctx.lineWidth = 0.3;
                for (var g = 0; g <= GRID_SIZE; g++) {
                    ctx.beginPath();
                    ctx.moveTo(g * CELL_SIZE, 0);
                    ctx.lineTo(g * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, g * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, g * CELL_SIZE);
                    ctx.stroke();
                }
            }

            // Draw food as African items
            function drawFood() {
                var fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                var fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                var radius = CELL_SIZE / 2 - 2;
                foodPulse += 0.08;
                var pulse = Math.sin(foodPulse) * 0.2 + 0.8;

                ctx.save();

                if (foodType === 0) {
                    // Mango (tropical fruit)
                    ctx.shadowColor = '#F5A623';
                    ctx.shadowBlur = 10 * pulse;
                    var mangoGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius * pulse);
                    mangoGrad.addColorStop(0, '#FFD93D');
                    mangoGrad.addColorStop(0.6, '#E8720C');
                    mangoGrad.addColorStop(1, '#CC5500');
                    ctx.fillStyle = mangoGrad;
                    ctx.beginPath();
                    ctx.ellipse(fx, fy, radius * 0.7 * pulse, radius * pulse, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Small green leaf at the top
                    ctx.fillStyle = '#4A7C2E';
                    ctx.beginPath();
                    ctx.ellipse(fx, fy - radius * pulse, 3, 2, -0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (foodType === 1) {
                    // Diamond / gem (8-point polygon)
                    ctx.shadowColor = '#ADD8E6';
                    ctx.shadowBlur = 15 * pulse;
                    var gemGrad = ctx.createLinearGradient(fx - radius * pulse, fy - radius * pulse, fx + radius * pulse, fy + radius * pulse);
                    gemGrad.addColorStop(0, '#FFFFFF');
                    gemGrad.addColorStop(0.5, '#ADD8E6');
                    gemGrad.addColorStop(1, '#E0E8FF');
                    ctx.fillStyle = gemGrad;
                    ctx.beginPath();
                    ctx.moveTo(fx, fy - radius * pulse);
                    ctx.lineTo(fx + radius * 0.6 * pulse, fy - radius * 0.3 * pulse);
                    ctx.lineTo(fx + radius * pulse, fy);
                    ctx.lineTo(fx + radius * 0.5 * pulse, fy + radius * 0.7 * pulse);
                    ctx.lineTo(fx, fy + radius * pulse);
                    ctx.lineTo(fx - radius * 0.5 * pulse, fy + radius * 0.7 * pulse);
                    ctx.lineTo(fx - radius * pulse, fy);
                    ctx.lineTo(fx - radius * 0.6 * pulse, fy - radius * 0.3 * pulse);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Sparkle lines
                    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.7 * pulse) + ')';
                    ctx.lineWidth = 1;
                    var sparkleLen = 4;
                    // 4 sparkle lines at 45° angles
                    ctx.beginPath();
                    ctx.moveTo(fx - sparkleLen, fy - sparkleLen);
                    ctx.lineTo(fx - sparkleLen * 2, fy - sparkleLen * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(fx + sparkleLen, fy - sparkleLen);
                    ctx.lineTo(fx + sparkleLen * 2, fy - sparkleLen * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(fx + sparkleLen, fy + sparkleLen);
                    ctx.lineTo(fx + sparkleLen * 2, fy + sparkleLen * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(fx - sparkleLen, fy + sparkleLen);
                    ctx.lineTo(fx - sparkleLen * 2, fy + sparkleLen * 2);
                    ctx.stroke();
                } else {
                    // Small mouse
                    ctx.shadowColor = '#E8720C';
                    ctx.shadowBlur = 8 * pulse;
                    // Body (horizontal ellipse)
                    ctx.fillStyle = '#8B6B4A';
                    ctx.beginPath();
                    ctx.ellipse(fx, fy, radius * 0.6 * pulse, radius * 0.4 * pulse, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Head (smaller circle forward)
                    ctx.beginPath();
                    ctx.arc(fx + radius * 0.5 * pulse, fy, radius * 0.25 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    // Ears (two tiny circles at top of head)
                    ctx.fillStyle = '#B08860';
                    ctx.beginPath();
                    ctx.arc(fx + radius * 0.45 * pulse, fy - radius * 0.25 * pulse, radius * 0.1 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(fx + radius * 0.6 * pulse, fy - radius * 0.2 * pulse, radius * 0.1 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Tail (curved line from back)
                    ctx.strokeStyle = '#B08860';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(fx - radius * 0.6 * pulse, fy);
                    ctx.quadraticCurveTo(fx - radius * 0.9 * pulse, fy - radius * 0.5 * pulse, fx - radius * 0.7 * pulse, fy - radius * 0.6 * pulse);
                    ctx.stroke();
                    // Eye (small white dot on head)
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(fx + radius * 0.55 * pulse, fy - radius * 0.05 * pulse, 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Draw snake head as a snake
            function drawSnakeHead(segment) {
                var cx = segment.x * CELL_SIZE + CELL_SIZE / 2;
                var cy = segment.y * CELL_SIZE + CELL_SIZE / 2;
                var size = CELL_SIZE / 2 - 1;

                ctx.save();

                // Translate and rotate based on direction
                ctx.translate(cx, cy);
                var angle = 0;
                if (direction.x === 1) angle = 0;
                else if (direction.x === -1) angle = Math.PI;
                else if (direction.y === -1) angle = -Math.PI / 2;
                else if (direction.y === 1) angle = Math.PI / 2;
                ctx.rotate(angle);

                // Glow effect
                ctx.shadowColor = '#E8720C';
                ctx.shadowBlur = 8;

                // Head shape (elongated oval)
                var headGrad = ctx.createLinearGradient(-size, 0, size, 0);
                headGrad.addColorStop(0, '#4A3728');
                headGrad.addColorStop(1, '#7B5B3A');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 1.0, size * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();

                // Reset shadow before fine details
                ctx.shadowBlur = 0;

                // Scale pattern on head (two small diamonds)
                ctx.fillStyle = '#8B6B4A';
                ctx.beginPath();
                ctx.moveTo(-size * 0.3, -size * 0.15 - 1.5);
                ctx.lineTo(-size * 0.3 + 1.5, -size * 0.15);
                ctx.lineTo(-size * 0.3, -size * 0.15 + 1.5);
                ctx.lineTo(-size * 0.3 - 1.5, -size * 0.15);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(size * 0.1, -size * 0.15 - 1.5);
                ctx.lineTo(size * 0.1 + 1.5, -size * 0.15);
                ctx.lineTo(size * 0.1, -size * 0.15 + 1.5);
                ctx.lineTo(size * 0.1 - 1.5, -size * 0.15);
                ctx.closePath();
                ctx.fill();

                // Eyes (white circles with black pupils)
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(size * 0.4, -size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(size * 0.4, size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                // Pupils
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(size * 0.45, -size * 0.35, size * 0.08, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(size * 0.45, size * 0.35, size * 0.08, 0, Math.PI * 2);
                ctx.fill();

                // Forked tongue
                ctx.strokeStyle = '#CC3333';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(size * 0.9, 0);
                ctx.lineTo(size * 1.2, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(size * 1.2, 0);
                ctx.lineTo(size * 1.4, -size * 0.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(size * 1.2, 0);
                ctx.lineTo(size * 1.4, size * 0.2);
                ctx.stroke();

                ctx.restore();
            }

            // Draw snake body with diamond pattern
            function drawSnakeBody() {
                for (var index = 1; index < snake.length; index++) {
                    var segment = snake[index];
                    var x = segment.x * CELL_SIZE + CELL_SIZE / 2;
                    var y = segment.y * CELL_SIZE + CELL_SIZE / 2;
                    var progress = index / snake.length; // 0 at head, 1 at tail

                    var alpha = 1 - progress * 0.7;
                    var size = (CELL_SIZE / 2 - 2) * (1 - progress * 0.3);

                    ctx.save();
                    ctx.globalAlpha = alpha;

                    // Glow/shadow
                    ctx.shadowColor = '#E8720C';
                    ctx.shadowBlur = 6 * (1 - progress);

                    // Base segment circle (alternating colors)
                    ctx.fillStyle = (index % 2 === 0) ? '#6B4A2E' : '#8B6B3A';
                    ctx.beginPath();
                    ctx.arc(x, y, size * 1.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Reset shadow before diamond overlay
                    ctx.shadowBlur = 0;

                    // Diamond pattern overlay
                    ctx.fillStyle = (index % 2 === 0) ? '#8B7B4A' : '#5C4A28';
                    ctx.beginPath();
                    ctx.moveTo(x, y - size * 0.5);
                    ctx.lineTo(x + size * 0.4, y);
                    ctx.lineTo(x, y + size * 0.5);
                    ctx.lineTo(x - size * 0.4, y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Draw particles
            function drawParticles() {
                // Food collection particles
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Thruster/dust particles
                for (var j = 0; j < thrusterParticles.length; j++) {
                    var tp = thrusterParticles[j];
                    ctx.save();
                    ctx.globalAlpha = tp.life * 0.7;
                    var tpColor = tp.life > 0.5 ? 'rgba(180, 150, 100, ' + tp.life + ')' : 'rgba(140, 110, 70, ' + tp.life + ')';
                    ctx.fillStyle = tpColor;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, tp.size * tp.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Draw everything
            function draw() {
                // Draw savanna background
                drawStarfield();

                // Draw particles (behind snake and food)
                drawParticles();

                // Draw food
                drawFood();

                // Draw snake body (before head so head overlaps)
                drawSnakeBody();

                // Draw snake head
                if (snake.length > 0) {
                    drawSnakeHead(snake[0]);
                }
            }

            // Animation loop for background scrolling and particle updates (runs independently)
            function animateBackground() {
                starfieldOffset += 0.3;
                updateParticles();
                if (gameRunning) {
                    // Redraw is handled by the game loop
                } else {
                    // When game is not running, still animate the background
                    draw();
                }
                animationFrame = requestAnimationFrame(animateBackground);
            }

            // Select difficulty and start the game
            function selectDifficulty(level) {
                var settings = DIFFICULTY_SETTINGS[level];
                if (!settings) return;

                currentDifficulty = level;
                gameSpeed = settings.speed;
                scoreMultiplier = settings.multiplier;
                difficultySelected = true;

                // Update the difficulty label in the header
                difficultyLabel.textContent = settings.label;
                difficultyLabel.className = 'difficulty-label ' + settings.cssClass;

                // Hide difficulty screen and start the game
                difficultyScreen.classList.add('hidden');
                startGame();
            }

            // Show the difficulty selection screen
            function showDifficultyScreen() {
                gameStarted = false;
                difficultySelected = false;
                gameOverScreen.classList.add('hidden');
                difficultyScreen.classList.remove('hidden');
                difficultyLabel.classList.add('hidden');
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                initGame();
                gameRunning = true;
                gameStarted = true;
                difficultyScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                draw();
                gameLoop = setInterval(function() {
                    update();
                    if (gameRunning) {
                        draw();
                    }
                }, gameSpeed);
            }

            // Restart game at same difficulty
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Difficulty selection keys (1, 2, 3) when on difficulty screen
                if (!difficultySelected && !gameStarted) {
                    if (e.key === '1') {
                        selectDifficulty('easy');
                        e.preventDefault();
                        return;
                    } else if (e.key === '2') {
                        selectDifficulty('medium');
                        e.preventDefault();
                        return;
                    } else if (e.key === '3') {
                        selectDifficulty('hard');
                        e.preventDefault();
                        return;
                    }
                }

                // Arrow keys should only work after difficulty is selected
                // Start game on arrow key if difficulty selected but game not yet started
                // (This handles the case where the game was just restarted)
                if (difficultySelected && !gameRunning && !gameStarted) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        startGame();
                        if (e.key === 'ArrowUp' && direction.y !== 1) {
                            nextDirection = { x: 0, y: -1 };
                        } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                            nextDirection = { x: 0, y: 1 };
                        } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                            nextDirection = { x: -1, y: 0 };
                        } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                            nextDirection = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        return;
                    }
                }

                // Restart on Enter when game over, Escape to change difficulty
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }
                if (!gameRunning && gameStarted && e.key === 'Escape') {
                    showDifficultyScreen();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers - Difficulty selection
            easyBtn.addEventListener('click', function() { selectDifficulty('easy'); });
            mediumBtn.addEventListener('click', function() { selectDifficulty('medium'); });
            hardBtn.addEventListener('click', function() { selectDifficulty('hard'); });

            // Button handlers - Game over
            restartBtn.addEventListener('click', restartGame);
            changeDifficultyBtn.addEventListener('click', showDifficultyScreen);

            // Start background animation
            animateBackground();

            // Draw initial state
            draw();
        })();
    </script>
</body>
</html>
