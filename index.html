<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Gravity Snake</title>
  <style>
    /* --- Section A: Reset & full-viewport canvas --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* --- Section B: Overlay screens (start, game-over) --- */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: auto;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 3rem;
      font-weight: 700;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff, 0 0 80px #7c4dff;
      margin-bottom: 1rem;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .overlay-subtitle {
      font-size: 1.1rem;
      color: #b0bec5;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .overlay-action {
      font-size: 1.3rem;
      color: #ffab40;
      margin-top: 1.5rem;
      text-shadow: 0 0 10px #ffab40;
      animation: pulse 1.5s ease-in-out infinite;
      text-align: center;
    }

    .overlay-score {
      font-size: 2rem;
      color: #ff5252;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 12px #ff5252;
      text-align: center;
    }

    .overlay-highscore {
      font-size: 1.2rem;
      color: #ffab40;
      margin-bottom: 1rem;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* --- Section C: HUD --- */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .hud-left, .hud-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-label {
      font-size: 14px;
      color: #b0bec5;
    }

    .hud-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffab40;
      text-shadow: 0 0 6px rgba(255, 171, 64, 0.5);
    }

    .speed-bar-container {
      width: 100px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .speed-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      border-radius: 4px;
      transition: width 0.1s ease;
      width: 0%;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div><span class="hud-label">SCORE: </span><span class="hud-value" id="hudScore">0</span></div>
      <div><span class="hud-label">HIGH: </span><span class="hud-value" id="hudHigh">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-label">SPEED</div>
      <div class="speed-bar-container">
        <div class="speed-bar-fill" id="hudSpeedBar"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="overlay-title">ZERO GRAVITY SNAKE</div>
    <div class="overlay-subtitle">Arrow keys or WASD to thrust</div>
    <div class="overlay-subtitle">No friction — you drift in space!</div>
    <div class="overlay-subtitle">Eat glowing orbs to grow. Avoid yourself.</div>
    <div class="overlay-action">Press SPACE to start</div>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <div class="overlay-title" style="color: #ff5252; text-shadow: 0 0 20px #ff5252, 0 0 40px #ff5252;">GAME OVER</div>
    <div class="overlay-score" id="finalScore">Score: 0</div>
    <div class="overlay-highscore" id="finalHigh">High Score: 0</div>
    <div class="overlay-action">Press SPACE to restart</div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- Section 1: Constants & tuning ---
      var THRUST = 0.15;
      var MAX_SPEED = 5;
      var HEAD_RADIUS = 8;
      var SEGMENT_SPACING = 14;
      var COLLISION_SKIP = 5;
      var FOOD_RADIUS = 10;
      var STAR_COUNT = 150;
      var INITIAL_LENGTH = 5;
      var GROW_AMOUNT = 3;

      // --- Section 2: State variables ---
      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');

      var hudScore = document.getElementById('hudScore');
      var hudHigh = document.getElementById('hudHigh');
      var hudSpeedBar = document.getElementById('hudSpeedBar');
      var startScreen = document.getElementById('startScreen');
      var gameOverScreen = document.getElementById('gameOverScreen');
      var finalScoreEl = document.getElementById('finalScore');
      var finalHighEl = document.getElementById('finalHigh');
      var hudEl = document.getElementById('hud');

      var canvasW = 800;
      var canvasH = 600;

      var snake = {
        headX: 0,
        headY: 0,
        vx: 0,
        vy: 0,
        trail: [],
        length: INITIAL_LENGTH
      };

      var food = { x: 0, y: 0, pulsePhase: 0 };
      var particles = [];
      var stars = [];
      var keys = {};

      var gameState = 'START';
      var score = 0;
      var highScore = 0;
      var gameOverDelay = 0;
      var ticksSinceStart = 0;

      // Try to load high score
      try {
        highScore = parseInt(localStorage.getItem('zeroGravitySnake_highScore')) || 0;
      } catch (e) {
        highScore = 0;
      }

      // --- Section 3: Utility functions ---
      function wrap(val, max) {
        return ((val % max) + max) % max;
      }

      function wrappedDist(x1, y1, x2, y2, w, h) {
        var dx = Math.abs(x1 - x2);
        var dy = Math.abs(y1 - y2);
        dx = Math.min(dx, w - dx);
        dy = Math.min(dy, h - dy);
        return Math.sqrt(dx * dx + dy * dy);
      }

      function clamp(val, lo, hi) {
        return Math.max(lo, Math.min(hi, val));
      }

      function vecLen(vx, vy) {
        return Math.sqrt(vx * vx + vy * vy);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function segRadius(i, totalLength) {
        var t = totalLength > 1 ? i / (totalLength - 1) : 0;
        return lerp(7, 3, t);
      }

      // --- Section 4: Audio (Web Audio API beeps) ---
      var audioCtx = null;

      function ensureAudio() {
        if (audioCtx) return;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        } catch (e) {
          // Audio not available
        }
      }

      function playEatSound() {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {
          // Ignore audio errors
        }
      }

      function playDeathSound() {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.4);
        } catch (e) {
          // Ignore audio errors
        }
      }

      // --- Section 5: Stars (background) ---
      function generateStars(w, h) {
        stars = [];
        for (var i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 2 + 0.5,
            brightness: Math.random(),
            twinkleOffset: Math.random() * Math.PI * 2
          });
        }
      }

      function drawStars(time) {
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.002 + s.twinkleOffset));
          alpha *= s.brightness;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          if (s.size > 1.5) {
            ctx.globalAlpha = alpha * 0.15;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      // --- Section 6: Snake data structure & physics ---
      function resetSnake() {
        snake.headX = canvasW / 2;
        snake.headY = canvasH / 2;
        snake.vx = 0;
        snake.vy = 0;
        snake.length = INITIAL_LENGTH;
        snake.trail = [];
        // Pre-fill trail so body segments exist immediately
        for (var i = 0; i < snake.length * SEGMENT_SPACING + SEGMENT_SPACING; i++) {
          snake.trail.push({ x: snake.headX, y: snake.headY });
        }
      }

      function updateSnake() {
        // Thrust
        if (keys['ArrowUp'] || keys['w'] || keys['W'] || keys['KeyW']) {
          snake.vy -= THRUST;
        }
        if (keys['ArrowDown'] || keys['s'] || keys['S'] || keys['KeyS']) {
          snake.vy += THRUST;
        }
        if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['KeyA']) {
          snake.vx -= THRUST;
        }
        if (keys['ArrowRight'] || keys['d'] || keys['D'] || keys['KeyD']) {
          snake.vx += THRUST;
        }

        // Speed cap
        var speed = vecLen(snake.vx, snake.vy);
        if (speed > MAX_SPEED) {
          snake.vx *= MAX_SPEED / speed;
          snake.vy *= MAX_SPEED / speed;
        }

        // No friction — velocity persists

        // Position update
        snake.headX += snake.vx;
        snake.headY += snake.vy;

        // Wrap-around
        snake.headX = wrap(snake.headX, canvasW);
        snake.headY = wrap(snake.headY, canvasH);

        // Trail recording
        snake.trail.unshift({ x: snake.headX, y: snake.headY });
        var maxTrail = snake.length * SEGMENT_SPACING + SEGMENT_SPACING;
        while (snake.trail.length > maxTrail) {
          snake.trail.pop();
        }

        // Increment ticks since start (used for spawn protection)
        ticksSinceStart++;
      }

      // --- Section 7: Food spawning & collection ---
      function spawnFood() {
        var attempts = 0;
        do {
          food.x = FOOD_RADIUS + Math.random() * (canvasW - 2 * FOOD_RADIUS);
          food.y = FOOD_RADIUS + Math.random() * (canvasH - 2 * FOOD_RADIUS);
          attempts++;
        } while (attempts < 20 && wrappedDist(food.x, food.y, snake.headX, snake.headY, canvasW, canvasH) < 50);
        food.pulsePhase = 0;
      }

      function checkFoodCollection() {
        var dist = wrappedDist(snake.headX, snake.headY, food.x, food.y, canvasW, canvasH);
        if (dist < HEAD_RADIUS + FOOD_RADIUS) {
          score++;
          snake.length += GROW_AMOUNT;
          if (score > highScore) {
            highScore = score;
            try {
              localStorage.setItem('zeroGravitySnake_highScore', String(highScore));
            } catch (e) {
              // Ignore storage errors
            }
          }
          emitFoodParticles(food.x, food.y);
          playEatSound();
          spawnFood();
          return true;
        }
        return false;
      }

      // --- Section 8: Particle system ---
      function emitParticles(x, y, count, speedMin, speedMax, lifeMin, lifeMax, colors) {
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var spd = speedMin + Math.random() * (speedMax - speedMin);
          var life = lifeMin + Math.random() * (lifeMax - lifeMin);
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: life,
            maxLife: life,
            size: 1 + Math.random() * 3,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      function emitFoodParticles(x, y) {
        emitParticles(x, y, 15, 1, 4, 0.5, 1.0, ['#00e5ff', '#ffab40', '#7c4dff', '#ffffff']);
      }

      function emitDeathParticles(x, y) {
        emitParticles(x, y, 40, 2, 6, 1.0, 1.5, ['#ff5252', '#ffab40', '#ffffff', '#ff8a65']);
      }

      function updateParticles(dt) {
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // --- Section 9: Collision detection ---
      function checkSelfCollision() {
        // Spawn protection: don't check collision until the trail has had time to spread
        // Minimum ticks needed: (COLLISION_SKIP + 1) * SEGMENT_SPACING so segments are actually distinct
        var minTicks = (COLLISION_SKIP + 1) * SEGMENT_SPACING;
        if (ticksSinceStart < minTicks) return false;
        if (snake.length <= COLLISION_SKIP) return false;
        for (var i = COLLISION_SKIP; i < snake.length; i++) {
          var idx = i * SEGMENT_SPACING;
          if (idx >= snake.trail.length) continue;
          var seg = snake.trail[idx];
          var r = segRadius(i, snake.length);
          var dist = wrappedDist(snake.headX, snake.headY, seg.x, seg.y, canvasW, canvasH);
          if (dist < HEAD_RADIUS + r - 2) {
            return true;
          }
        }
        return false;
      }

      // --- Section 10: Input handling ---
      document.addEventListener('keydown', function (e) {
        ensureAudio();
        keys[e.key] = true;
        keys[e.code] = true;

        if (e.key === ' ' || e.code === 'Space') {
          if (gameState === 'START') {
            startGame();
          } else if (gameState === 'GAME_OVER' && gameOverDelay <= 0) {
            transitionTo('START');
          }
          e.preventDefault();
        }

        // Prevent default for game keys during play
        if (gameState === 'PLAYING') {
          var gameKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '];
          if (gameKeys.indexOf(e.key) !== -1) {
            e.preventDefault();
          }
        }
      });

      document.addEventListener('keyup', function (e) {
        delete keys[e.key];
        delete keys[e.code];
      });

      // --- Section 11: HUD & screen state machine ---
      function startGame() {
        transitionTo('PLAYING');
      }

      function transitionTo(newState) {
        gameState = newState;

        if (newState === 'START') {
          startScreen.classList.remove('hidden');
          gameOverScreen.classList.add('hidden');
          hudEl.style.display = 'none';
          score = 0;
          resetSnake();
          spawnFood();
          particles = [];
        } else if (newState === 'PLAYING') {
          startScreen.classList.add('hidden');
          gameOverScreen.classList.add('hidden');
          hudEl.style.display = 'flex';
          score = 0;
          ticksSinceStart = 0;
          resetSnake();
          spawnFood();
          particles = [];
        } else if (newState === 'GAME_OVER') {
          gameOverDelay = 90; // ~1.5s at 60fps before allowing restart
          gameOverScreen.classList.remove('hidden');
          finalScoreEl.textContent = 'Score: ' + score;
          finalHighEl.textContent = 'High Score: ' + highScore;
        }
      }

      function updateHUD() {
        hudScore.textContent = score;
        hudHigh.textContent = highScore;
        var speed = vecLen(snake.vx, snake.vy);
        var pct = clamp(speed / MAX_SPEED * 100, 0, 100);
        hudSpeedBar.style.width = pct + '%';
      }

      // --- Section 12: Rendering ---
      function drawFood(time) {
        var pulse = Math.sin(time * 0.004) * 0.15 + 0.85;
        var r = FOOD_RADIUS * pulse;

        // Outer glow
        ctx.save();
        ctx.shadowColor = '#ffab40';
        ctx.shadowBlur = 20;

        var grad = ctx.createRadialGradient(food.x, food.y, 0, food.x, food.y, r * 1.5);
        grad.addColorStop(0, 'rgba(255, 171, 64, 0.8)');
        grad.addColorStop(0.5, 'rgba(255, 171, 64, 0.3)');
        grad.addColorStop(1, 'rgba(255, 171, 64, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(food.x, food.y, r * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Core
        var coreGrad = ctx.createRadialGradient(food.x, food.y, 0, food.x, food.y, r);
        coreGrad.addColorStop(0, '#ffffff');
        coreGrad.addColorStop(0.4, '#ffab40');
        coreGrad.addColorStop(1, '#ff8a65');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(food.x, food.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSegmentAt(x, y, r, hue) {
        ctx.save();
        ctx.shadowColor = 'hsl(' + hue + ', 100%, 60%)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'hsl(' + hue + ', 100%, 60%)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSnake() {
        // Draw body segments from tail to head (so head renders on top)
        for (var i = snake.length - 1; i >= 1; i--) {
          var idx = i * SEGMENT_SPACING;
          if (idx >= snake.trail.length) continue;
          var seg = snake.trail[idx];
          var r = segRadius(i, snake.length);
          var t = snake.length > 1 ? i / (snake.length - 1) : 0;
          // HSL interpolation: 180 (cyan) at head-end to 270 (purple) at tail-end
          var hue = lerp(180, 270, t);

          drawSegmentAt(seg.x, seg.y, r, hue);

          // Wrap-safe rendering: ghost copies at edges
          if (seg.x < r) drawSegmentAt(seg.x + canvasW, seg.y, r, hue);
          if (seg.x > canvasW - r) drawSegmentAt(seg.x - canvasW, seg.y, r, hue);
          if (seg.y < r) drawSegmentAt(seg.x, seg.y + canvasH, r, hue);
          if (seg.y > canvasH - r) drawSegmentAt(seg.x, seg.y - canvasH, r, hue);
          // Corner wraps
          if (seg.x < r && seg.y < r) drawSegmentAt(seg.x + canvasW, seg.y + canvasH, r, hue);
          if (seg.x > canvasW - r && seg.y < r) drawSegmentAt(seg.x - canvasW, seg.y + canvasH, r, hue);
          if (seg.x < r && seg.y > canvasH - r) drawSegmentAt(seg.x + canvasW, seg.y - canvasH, r, hue);
          if (seg.x > canvasW - r && seg.y > canvasH - r) drawSegmentAt(seg.x - canvasW, seg.y - canvasH, r, hue);
        }

        // Draw head
        ctx.save();
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 20;

        var headGrad = ctx.createRadialGradient(snake.headX, snake.headY, 0, snake.headX, snake.headY, HEAD_RADIUS);
        headGrad.addColorStop(0, '#ffffff');
        headGrad.addColorStop(0.3, '#00e5ff');
        headGrad.addColorStop(1, '#0088aa');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(snake.headX, snake.headY, HEAD_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        // Direction indicator
        var speed = vecLen(snake.vx, snake.vy);
        if (speed > 0.1) {
          var dx = snake.vx / speed;
          var dy = snake.vy / speed;
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = 0.9;
          ctx.beginPath();
          ctx.arc(snake.headX + dx * HEAD_RADIUS * 0.6, snake.headY + dy * HEAD_RADIUS * 0.6, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();

        // Head wrap-safe rendering
        var hr = HEAD_RADIUS;
        if (snake.headX < hr) { drawHeadGhost(snake.headX + canvasW, snake.headY); }
        if (snake.headX > canvasW - hr) { drawHeadGhost(snake.headX - canvasW, snake.headY); }
        if (snake.headY < hr) { drawHeadGhost(snake.headX, snake.headY + canvasH); }
        if (snake.headY > canvasH - hr) { drawHeadGhost(snake.headX, snake.headY - canvasH); }
      }

      function drawHeadGhost(x, y) {
        ctx.save();
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 20;
        var headGrad = ctx.createRadialGradient(x, y, 0, x, y, HEAD_RADIUS);
        headGrad.addColorStop(0, '#ffffff');
        headGrad.addColorStop(0.3, '#00e5ff');
        headGrad.addColorStop(1, '#0088aa');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(x, y, HEAD_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function render(time) {
        // Clear
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvasW, canvasH);

        // Stars
        drawStars(time);

        if (gameState === 'PLAYING' || gameState === 'GAME_OVER') {
          // Food (only during playing)
          if (gameState === 'PLAYING') {
            drawFood(time);
          }

          // Snake
          drawSnake();

          // Particles
          drawParticles();

          // HUD
          updateHUD();
        }
      }

      // --- Section 13: Game loop ---
      var lastTime = 0;

      function gameLoop(timestamp) {
        requestAnimationFrame(gameLoop);

        var dt = timestamp - lastTime;
        if (dt > 32) dt = 16;
        lastTime = timestamp;
        var dtSec = dt / 1000;

        if (gameState === 'PLAYING') {
          updateSnake();
          checkFoodCollection();
          if (checkSelfCollision()) {
            emitDeathParticles(snake.headX, snake.headY);
            playDeathSound();
            transitionTo('GAME_OVER');
          }
        }

        if (gameState === 'GAME_OVER') {
          if (gameOverDelay > 0) gameOverDelay--;
        }

        // Always update particles
        updateParticles(dtSec);

        render(timestamp);
      }

      // --- Section 14: Canvas resize handler ---
      function resizeCanvas() {
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        canvas.width = canvasW;
        canvas.height = canvasH;
        generateStars(canvasW, canvasH);

        // If food is out of bounds, respawn it
        if (food.x < 0 || food.x > canvasW || food.y < 0 || food.y > canvasH) {
          spawnFood();
        }
      }

      window.addEventListener('resize', resizeCanvas);

      // --- Section 15: Init & boot ---
      resizeCanvas();
      resetSnake();
      spawnFood();

      // Update HUD initial values
      hudScore.textContent = '0';
      hudHigh.textContent = String(highScore);
      hudEl.style.display = 'none';

      transitionTo('START');
      requestAnimationFrame(gameLoop);

      // --- Test hooks (for automated testing) ---
      if (typeof window !== 'undefined') {
        window.__TEST_HOOKS__ = {
          getSnake: function () { return snake; },
          setKeys: function (obj) {
            // Clear existing keys and set new ones
            for (var k in keys) { delete keys[k]; }
            for (var k in obj) { keys[k] = obj[k]; }
          },
          tick: function () {
            if (gameState === 'PLAYING') {
              updateSnake();
              checkFoodCollection();
              if (checkSelfCollision()) {
                emitDeathParticles(snake.headX, snake.headY);
                playDeathSound();
                transitionTo('GAME_OVER');
              }
            }
            updateParticles(1 / 60);
          },
          getScore: function () { return score; },
          getHighScore: function () {
            try {
              return parseInt(localStorage.getItem('zeroGravitySnake_highScore')) || 0;
            } catch (e) {
              return highScore;
            }
          },
          getFood: function () { return food; },
          setFood: function (x, y) { food.x = x; food.y = y; },
          getGameState: function () { return gameState; },
          startGame: function () { startGame(); },
          getCanvasSize: function () { return { w: canvasW, h: canvasH }; },
          getParticles: function () { return particles; },
          // Expose constants for testing
          MAX_SPEED: MAX_SPEED,
          THRUST: THRUST,
          COLLISION_SKIP: COLLISION_SKIP,
          SEGMENT_SPACING: SEGMENT_SPACING,
          HEAD_RADIUS: HEAD_RADIUS,
          FOOD_RADIUS: FOOD_RADIUS,
          getTicksSinceStart: function () { return ticksSinceStart; },
          setTicksSinceStart: function (v) { ticksSinceStart = v; }
        };
      }
    })();
  </script>
</body>
