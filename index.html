<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .score-display {
            font-size: 20px;
            color: #ffdd57;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background-color: rgba(10, 10, 30, 0.92);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .overlay p {
            font-size: 16px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #ffdd57;
            font-weight: bold;
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
            background-color: #00ff88;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: #00cc6a;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">Snake</div>
            <div class="score-display">Score: <span id="score">0</span></div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="startScreen">
                <h2>Snake Game</h2>
                <p>Use arrow keys to control the snake.<br>Eat food to grow and earn points.<br>Avoid hitting walls and yourself!</p>
                <button class="btn" id="startBtn">Start Game</button>
                <div class="instructions">Press any arrow key to begin</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>Game Over</h2>
                <p class="final-score">Score: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">Play Again</button>
                <div class="instructions">Press Enter or click to restart</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
            const GAME_SPEED = 120; // milliseconds between frames

            // Colors
            const COLORS = {
                background: '#0f0f23',
                grid: '#16213e',
                snake: '#00ff88',
                snakeHead: '#00ffaa',
                snakeOutline: '#009955',
                food: '#ff6b6b',
                foodGlow: '#ff4444'
            };

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                scoreDisplay.textContent = '0';
                spawnFood();
            }

            // Spawn food at random position not occupied by snake
            function spawnFood() {
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }));
                food = newFood;
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreDisplay.textContent = score;
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Draw everything
            function draw() {
                // Clear canvas
                ctx.fillStyle = COLORS.background;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Draw grid lines (subtle)
                ctx.strokeStyle = COLORS.grid;
                ctx.lineWidth = 0.5;
                for (var i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                    ctx.stroke();
                }

                // Draw food with glow effect
                var foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
                var foodY = food.y * CELL_SIZE + CELL_SIZE / 2;
                var foodRadius = CELL_SIZE / 2 - 2;

                // Glow
                ctx.shadowColor = COLORS.foodGlow;
                ctx.shadowBlur = 10;
                ctx.fillStyle = COLORS.food;
                ctx.beginPath();
                ctx.arc(foodX, foodY, foodRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw snake
                for (var index = 0; index < snake.length; index++) {
                    var segment = snake[index];
                    var x = segment.x * CELL_SIZE;
                    var y = segment.y * CELL_SIZE;
                    var padding = 1;

                    if (index === 0) {
                        // Head - slightly brighter
                        ctx.shadowColor = COLORS.snake;
                        ctx.shadowBlur = 6;
                        ctx.fillStyle = COLORS.snakeHead;
                        ctx.fillRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
                        ctx.shadowBlur = 0;

                        // Eyes
                        ctx.fillStyle = '#1a1a2e';
                        var eyeSize = 3;
                        var eyeX1, eyeY1, eyeX2, eyeY2;

                        if (direction.x === 1) { // right
                            eyeX1 = x + CELL_SIZE - 7; eyeY1 = y + 5;
                            eyeX2 = x + CELL_SIZE - 7; eyeY2 = y + CELL_SIZE - 8;
                        } else if (direction.x === -1) { // left
                            eyeX1 = x + 4; eyeY1 = y + 5;
                            eyeX2 = x + 4; eyeY2 = y + CELL_SIZE - 8;
                        } else if (direction.y === -1) { // up
                            eyeX1 = x + 5; eyeY1 = y + 4;
                            eyeX2 = x + CELL_SIZE - 8; eyeY2 = y + 4;
                        } else { // down
                            eyeX1 = x + 5; eyeY1 = y + CELL_SIZE - 7;
                            eyeX2 = x + CELL_SIZE - 8; eyeY2 = y + CELL_SIZE - 7;
                        }

                        ctx.beginPath();
                        ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Body - gradient effect based on position
                        var alpha = 1 - (index / snake.length) * 0.4;
                        ctx.fillStyle = 'rgba(0, 255, 136, ' + alpha + ')';
                        ctx.fillRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
                    }

                    // Border for each segment
                    ctx.strokeStyle = COLORS.snakeOutline;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
                }
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                initGame();
                gameRunning = true;
                gameStarted = true;
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                draw();
                gameLoop = setInterval(function() {
                    update();
                    if (gameRunning) {
                        draw();
                    }
                }, GAME_SPEED);
            }

            // Restart game
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Start game on arrow key if not started
                if (!gameStarted && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                    startGame();
                    // Set initial direction based on key pressed
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                    return;
                }

                // Restart on Enter when game over
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);

            // Draw initial state (background)
            draw();
        })();
    </script>
</body>
</html>
