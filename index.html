<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Serpent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #021019;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #39e6c8;
            text-shadow: 0 0 10px rgba(57, 230, 200, 0.35);
        }

        .score-display {
            font-size: 20px;
            color: #7fdfff;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #39e6c8;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(57, 230, 200, 0.25);
            display: block;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            height: 400px;
            background-color: rgba(3, 16, 25, 0.9);
            border-radius: 4px;
            gap: 16px;
        }

        .overlay h2 {
            font-size: 32px;
            color: #39e6c8;
            text-shadow: 0 0 10px rgba(57, 230, 200, 0.5);
        }

        .overlay p {
            font-size: 16px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 24px;
            color: #7fdfff;
            font-weight: bold;
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #021019;
            background-color: #39e6c8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: #2bbfa6;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">Abyssal Serpent</div>
            <div class="score-display">Score: <span id="score">0</span></div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="startScreen">
                <h2>Abyssal Serpent</h2>
                <p>Use the arrow keys to steer your serpent.<br>Devour glowing pearls to grow and score.<br>Avoid the reef walls and your own tail!</p>
                <button class="btn" id="startBtn">Start Game</button>
                <div class="instructions">Press any arrow key to begin</div>
            </div>
            <div class="overlay hidden" id="gameOverScreen">
                <h2>Game Over</h2>
                <p class="final-score">Score: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">Play Again</button>
                <div class="instructions">Press Enter or click to restart</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Game constants
            const CANVAS_SIZE = 400;
            const GRID_SIZE = 20;
            const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
            const GAME_SPEED = 120; // milliseconds between frames

            // Colors — ocean / bioluminescent palette
            const COLORS = {
                waterTop: '#0e8a99',
                waterMid: '#063a4d',
                waterBottom: '#02121d',
                grid: 'rgba(127, 223, 255, 0.05)',
                serpent: '#1fbf8f',
                serpentHead: '#7dffd8',
                serpentGlow: '#39e6c8',
                pearl: '#eafcff',
                pearlGlow: '#7fdfff'
            };

            // Game state
            let snake = [];
            let food = { x: 0, y: 0 };
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let gameRunning = false;
            let gameLoop = null;
            let gameStarted = false;

            // Animation state (render decoupled from logic tick)
            let animTime = 0;
            let lastFrame = 0;
            let rafId = null;
            let waterGradient = null;
            let bubbles = [];

            // DOM elements
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('finalScore');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            // Initialize game
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                scoreDisplay.textContent = '0';
                spawnFood();
            }

            // Spawn food at random position not occupied by snake
            function spawnFood() {
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (snake.some(function(segment) { return segment.x === newFood.x && segment.y === newFood.y; }));
                food = newFood;
            }

            // Update game state
            function update() {
                // Apply buffered direction
                direction = { x: nextDirection.x, y: nextDirection.y };

                // Calculate new head position
                var head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (snake.some(function(segment) { return segment.x === head.x && segment.y === head.y; })) {
                    gameOver();
                    return;
                }

                // Add new head
                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreDisplay.textContent = score;
                    spawnFood();
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }

            // Initialize the ambient bubble field once
            function initBubbles() {
                bubbles = [];
                var count = 22;
                for (var i = 0; i < count; i++) {
                    bubbles.push({
                        x: Math.random() * CANVAS_SIZE,
                        y: Math.random() * CANVAS_SIZE,
                        r: 1 + Math.random() * 2,
                        speed: 0.008 + Math.random() * 0.02, // px per ms
                        drift: 4 + Math.random() * 8,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            // Draw slowly drifting diagonal light rays (caustics)
            function drawLightRays() {
                var beams = 3;
                for (var b = 0; b < beams; b++) {
                    var baseX = (b + 0.5) * (CANVAS_SIZE / beams);
                    var offset = Math.sin(animTime * 0.0002 + b * 1.7) * 40;
                    var x = baseX + offset;
                    var width = 42;
                    var grad = ctx.createLinearGradient(x, 0, x + width * 1.5, CANVAS_SIZE);
                    grad.addColorStop(0, 'rgba(127, 223, 255, 0.07)');
                    grad.addColorStop(1, 'rgba(127, 223, 255, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x + width, 0);
                    ctx.lineTo(x + width * 1.8 + 30, CANVAS_SIZE);
                    ctx.lineTo(x + width * 1.8, CANVAS_SIZE);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Move and draw rising bubbles (alpha only, no per-bubble shadow)
            function updateAndDrawBubbles(dt) {
                ctx.fillStyle = 'rgba(200, 245, 255, 0.28)';
                for (var i = 0; i < bubbles.length; i++) {
                    var bub = bubbles[i];
                    bub.y -= bub.speed * dt;
                    if (bub.y < -bub.r) {
                        bub.y = CANVAS_SIZE + bub.r;
                        bub.x = Math.random() * CANVAS_SIZE;
                    }
                    var wobble = Math.sin(animTime * 0.002 + bub.phase) * bub.drift;
                    ctx.beginPath();
                    ctx.arc(bub.x + wobble, bub.y, bub.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw everything
            function draw(dt) {
                dt = dt || 16;

                // Deep-ocean vertical gradient background (cached)
                if (!waterGradient) {
                    waterGradient = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
                    waterGradient.addColorStop(0, COLORS.waterTop);
                    waterGradient.addColorStop(0.5, COLORS.waterMid);
                    waterGradient.addColorStop(1, COLORS.waterBottom);
                }
                ctx.fillStyle = waterGradient;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Very faint grid to keep a sense of the play field
                ctx.strokeStyle = COLORS.grid;
                ctx.lineWidth = 0.5;
                for (var i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                    ctx.stroke();
                }

                // Ambient motion behind gameplay
                drawLightRays();
                updateAndDrawBubbles(dt);

                // Only draw gameplay elements once a game is in progress
                if (!gameStarted || !snake.length) {
                    return;
                }

                // Draw food as a glowing pearl
                var foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
                var foodY = food.y * CELL_SIZE + CELL_SIZE / 2;
                var foodRadius = CELL_SIZE / 2 - 2;

                ctx.shadowColor = COLORS.pearlGlow;
                ctx.shadowBlur = 6 + 4 * Math.sin(animTime * 0.006);
                var pearlGrad = ctx.createRadialGradient(
                    foodX - foodRadius * 0.3, foodY - foodRadius * 0.3, foodRadius * 0.1,
                    foodX, foodY, foodRadius
                );
                pearlGrad.addColorStop(0, '#ffffff');
                pearlGrad.addColorStop(0.4, COLORS.pearl);
                pearlGrad.addColorStop(0.8, COLORS.pearlGlow);
                pearlGrad.addColorStop(1, 'rgba(57, 230, 200, 0.6)');
                ctx.fillStyle = pearlGrad;
                ctx.beginPath();
                ctx.arc(foodX, foodY, foodRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Build pixel centers for the serpent body
                var pts = [];
                for (var s = 0; s < snake.length; s++) {
                    pts.push({
                        x: snake[s].x * CELL_SIZE + CELL_SIZE / 2,
                        y: snake[s].y * CELL_SIZE + CELL_SIZE / 2
                    });
                }

                // Head→tail gradient for the serpent body
                var tail = pts[pts.length - 1];
                var bodyGrad = ctx.createLinearGradient(pts[0].x, pts[0].y, tail.x, tail.y);
                bodyGrad.addColorStop(0, COLORS.serpentHead);
                bodyGrad.addColorStop(1, COLORS.serpent);

                // Draw the body as one smoothed path through the segment centers
                ctx.shadowColor = COLORS.serpentGlow;
                ctx.shadowBlur = 8;
                ctx.strokeStyle = bodyGrad;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                if (pts.length === 1) {
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.arc(pts[0].x, pts[0].y, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Outer glowing body
                    ctx.lineWidth = CELL_SIZE - 4;
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (var p = 1; p < pts.length - 1; p++) {
                        var midX = (pts[p].x + pts[p + 1].x) / 2;
                        var midY = (pts[p].y + pts[p + 1].y) / 2;
                        ctx.quadraticCurveTo(pts[p].x, pts[p].y, midX, midY);
                    }
                    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
                    ctx.stroke();

                    // Brighter thinner core for the bioluminescent look
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(230, 255, 245, 0.5)';
                    ctx.lineWidth = CELL_SIZE / 2 - 3;
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (var q = 1; q < pts.length - 1; q++) {
                        var mX = (pts[q].x + pts[q + 1].x) / 2;
                        var mY = (pts[q].y + pts[q + 1].y) / 2;
                        ctx.quadraticCurveTo(pts[q].x, pts[q].y, mX, mY);
                    }
                    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;

                // Rounded serpent head
                var headSeg = snake[0];
                var hx = headSeg.x * CELL_SIZE;
                var hy = headSeg.y * CELL_SIZE;
                var hcx = hx + CELL_SIZE / 2;
                var hcy = hy + CELL_SIZE / 2;
                var headGrad = ctx.createRadialGradient(hcx, hcy, 1, hcx, hcy, CELL_SIZE / 2);
                headGrad.addColorStop(0, COLORS.serpentHead);
                headGrad.addColorStop(1, COLORS.serpent);
                ctx.shadowColor = COLORS.serpentGlow;
                ctx.shadowBlur = 10;
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(hcx, hcy, CELL_SIZE / 2 - 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes — reuse direction-based placement so they track heading
                ctx.fillStyle = '#021019';
                var eyeSize = 3;
                var eyeX1, eyeY1, eyeX2, eyeY2;

                if (direction.x === 1) { // right
                    eyeX1 = hx + CELL_SIZE - 7; eyeY1 = hy + 5;
                    eyeX2 = hx + CELL_SIZE - 7; eyeY2 = hy + CELL_SIZE - 8;
                } else if (direction.x === -1) { // left
                    eyeX1 = hx + 4; eyeY1 = hy + 5;
                    eyeX2 = hx + 4; eyeY2 = hy + CELL_SIZE - 8;
                } else if (direction.y === -1) { // up
                    eyeX1 = hx + 5; eyeY1 = hy + 4;
                    eyeX2 = hx + CELL_SIZE - 8; eyeY2 = hy + 4;
                } else { // down
                    eyeX1 = hx + 5; eyeY1 = hy + CELL_SIZE - 7;
                    eyeX2 = hx + CELL_SIZE - 8; eyeY2 = hy + CELL_SIZE - 7;
                }

                ctx.beginPath();
                ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            }

            // Game over handler
            function gameOver() {
                gameRunning = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }

            // Start game
            function startGame() {
                initGame();
                gameRunning = true;
                gameStarted = true;
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                gameLoop = setInterval(update, GAME_SPEED);
            }

            // Restart game
            function restartGame() {
                gameOverScreen.classList.add('hidden');
                startGame();
            }

            // Input handling
            document.addEventListener('keydown', function(e) {
                // Start game on arrow key if not started
                if (!gameStarted && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                    startGame();
                    // Set initial direction based on key pressed
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                    return;
                }

                // Restart on Enter when game over
                if (!gameRunning && gameStarted && e.key === 'Enter') {
                    restartGame();
                    e.preventDefault();
                    return;
                }

                // Direction controls during gameplay
                if (gameRunning) {
                    if (e.key === 'ArrowUp' && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    } else if (e.key === 'ArrowDown' && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    } else if (e.key === 'ArrowRight' && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                }
            });

            // Button handlers
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);

            // Continuous render loop (decoupled from the logic tick)
            function render(now) {
                var dt = (now - lastFrame) || 16;
                lastFrame = now;
                animTime = now;
                draw(dt);
                rafId = requestAnimationFrame(render);
            }

            // Initialize ambient field and start the render loop
            initBubbles();
            requestAnimationFrame(render);
        })();
    </script>
</body>
</html>
